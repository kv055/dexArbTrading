# Gitea CI/CD workflow.
#
# GitHub never reads .gitea/, so this file does NOT affect GitHub CI. Gitea, once a
# .gitea/workflows/ file exists, uses it and ignores .github/workflows/ — so on Gitea
# only this runs.
#
# develop: test + build (push images to Gitea registry)
# main:    test + build (push images to GHCR) + pre-deploy + deploy to VPS
name: ci

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - '.vscode/**'
      - '.codex'
      - '.agents/**'
      - 'deploy/provision/**'
      - 'dexMmController/docs/**'
      - 'dexMonitor/docs/**'
      - 'dexUnifiedApi/docs/**'
      - 'dexMmTradingLogicHummingBot/**'
      - '.gitignore'
      - '.gitmodules'
      - 'LICENSE'

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  security:
    name: Secret protection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch submodules from the Gitea mirror
        run: |
          host="${REGISTRY_URL#*://}"; scheme="${REGISTRY_URL%%://*}"
          git config --global url."${scheme}://x-access-token:${REG_TOKEN}@${host}/${OWNER}/".insteadOf "https://github.com/kv055/"
          git submodule update --init --recursive
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REG_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          OWNER: ${{ github.repository_owner }}

      - name: Install Gitleaks
        run: |
          set -Eeuo pipefail
          install_dir=$(mktemp -d)
          trap 'rm -rf "$install_dir"' EXIT
          archive="$install_dir/gitleaks.tar.gz"
          bin_dir="${RUNNER_TEMP:-$HOME/.local}/gitleaks-${GITLEAKS_VERSION}"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$archive"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum -c -
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$install_dir" gitleaks
          install "$install_dir/gitleaks" "$bin_dir/gitleaks"
          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"

      - name: Reject plaintext dotenv files
        run: |
          set -Eeuo pipefail
          offending=()
          while IFS= read -r -d '' path; do
            basename=${path##*/}
            case "$basename" in
              .env|.env.*)
                case "$basename" in
                  *.enc|*.example) ;;
                  *) offending+=("$path") ;;
                esac
                ;;
            esac
          done < <(find . -type d -name .git -prune -o -type f \( -name '.env' -o -name '.env.*' \) -print0)
          if ((${#offending[@]})); then
            printf 'ERROR: plaintext dotenv files are forbidden in the checkout:\n' >&2
            printf '  %s\n' "${offending[@]}" >&2
            exit 1
          fi

      - name: Scan root and submodule snapshot
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner

  detect-changes:
    # Diff the push range and decide which tests, image builds, and GHCR re-tags run.
    name: Detect changed services
    needs: security
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.detect.outputs.changes }}
      test_modules: ${{ steps.detect.outputs.test_modules }}
      test_modules_json: ${{ steps.detect.outputs.test_modules_json }}
      run_frontend: ${{ steps.detect.outputs.run_frontend }}
      build_matrix_json: ${{ steps.detect.outputs.build_matrix_json }}
      retag_services_json: ${{ steps.detect.outputs.retag_services_json }}
      deploy_main: ${{ steps.deploy.outputs.main }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Need the push's "before" commit available locally to diff the full
          # pushed range (a push can carry several commits / a merge).
          fetch-depth: 0
      - name: Determine changed services
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          ALL_SERVICES="tor,bisq,bisq2,unified-api,unified-snapshot,postgres-backup,dexmonitor,mm-controller,totp-api,fiat-controller"
          ALL_MODULES="commons,dexUnifiedApi,dexMmController,dexMonitor,dexFiatController"
          ZERO="0000000000000000000000000000000000000000"

          add_csv() {
            local list="$1" item="$2"
            case ",$list," in *",$item,"*) echo "$list" ;; *) echo "${list:+$list,}$item" ;; esac
          }

          comma_to_json_array() {
            local csv="${1:-}"
            if [ -z "$csv" ]; then echo '[]'; return; fi
            local IFS=',' parts=() p json='[' first=true
            read -ra parts <<< "$csv"
            for p in "${parts[@]}"; do
              [ -n "$p" ] || continue
              $first || json+=','
              first=false
              json+="\"$p\""
            done
            json+=']'
            echo "$json"
          }

          build_matrix_json_for() {
            local csv="${1:-}"
            [ -n "$csv" ] || { echo '[]'; return; }
            jq -n --arg csv "$csv" '
              ($csv | split(",") | map(select(length > 0))) as $want |
              [
                {service:"tor",             context:"./dexUnifiedApi", dockerfile:"dexUnifiedApi/Dockerfile.tor"},
                {service:"bisq",            context:"./dexUnifiedApi", dockerfile:"dexUnifiedApi/Dockerfile.bisq"},
                {service:"bisq2",           context:"./dexUnifiedApi", dockerfile:"dexUnifiedApi/Dockerfile.bisq2"},
                {service:"unified-api",     context:".", dockerfile:"dexUnifiedApi/Dockerfile"},
                {service:"unified-snapshot",context:".", dockerfile:"dexUnifiedApi/Dockerfile.snapshot"},
                {service:"postgres-backup", context:".", dockerfile:"dexUnifiedApi/Dockerfile.backup"},
                {service:"dexmonitor",      context:".", dockerfile:"dexMonitor/Dockerfile"},
                {service:"mm-controller",   context:"./dexMmController", dockerfile:"dexMmController/Dockerfile"},
                {service:"totp-api",        context:"./dexFiatController/services/totp-api", dockerfile:"dexFiatController/services/totp-api/Dockerfile"},
                {service:"fiat-controller",context:"./dexFiatController", dockerfile:"dexFiatController/Dockerfile"}
              ] | map(select(.service as $s | $want | index($s)))
            '
          }

          retag_services_json_for() {
            local changes_csv="${1:-}"
            jq -n --arg all "$ALL_SERVICES" --arg changed "${changes_csv:-}" '
              ($all | split(",")) as $all |
              ($changed | split(",") | map(select(length > 0))) as $changed |
              [$all[] | select(. as $s | ($changed | index($s) | not))]
            '
          }

          write_outputs() {
            local changes="$1" test_modules="$2" run_frontend="$3"
            local test_modules_json build_matrix_json retag_services_json
            test_modules_json=$(comma_to_json_array "$test_modules")
            build_matrix_json=$(build_matrix_json_for "$changes")
            retag_services_json=$(retag_services_json_for "$changes")
            echo "changes=${changes:-}" >> "$GITHUB_OUTPUT"
            echo "test_modules=${test_modules:-}" >> "$GITHUB_OUTPUT"
            echo "run_frontend=${run_frontend}" >> "$GITHUB_OUTPUT"
            {
              echo 'test_modules_json<<EOF'
              echo "$test_modules_json"
              echo 'EOF'
              echo 'build_matrix_json<<EOF'
              echo "$build_matrix_json"
              echo 'EOF'
              echo 'retag_services_json<<EOF'
              echo "$retag_services_json"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
            echo "services to build: ${changes:-<none>}"
            echo "test modules: ${test_modules:-<none>}"
            echo "run frontend: ${run_frontend}"
            echo "build matrix: ${build_matrix_json}"
            echo "retag services: ${retag_services_json}"
          }

          emit_all() {
            echo "${1:-build all}"
            write_outputs "$ALL_SERVICES" "$ALL_MODULES" "true"
          }

          resolve_base() {
            local before="${1:-}" after="${2:-}"
            echo "resolve_base: event=${EVENT:-} before=${before:-<empty>} after=${after:-<empty>}" >&2
            if [ -n "$before" ] && [ "$before" != "$ZERO" ] && git cat-file -e "${before}^{commit}" 2>/dev/null; then
              echo "$before"; return 0
            fi
            if git cat-file -e "${after}^{commit}" 2>/dev/null && parent=$(git rev-parse "${after}^" 2>/dev/null); then
              echo "before unusable (${before:-<empty>}); falling back to parent ${parent}" >&2
              echo "$parent"; return 0
            fi
            echo ""
          }

          map_paths() {
            local changed="$1" S="" M="" run_frontend=false
            path_changed() { printf '%s\n' "$changed" | grep -qE "$1"; }
            if path_changed '^commons(/|$)'; then
              S=$(add_csv "$S" unified-api); S=$(add_csv "$S" unified-snapshot)
              S=$(add_csv "$S" postgres-backup); S=$(add_csv "$S" dexmonitor)
              M=$(add_csv "$M" commons); M=$(add_csv "$M" dexUnifiedApi); M=$(add_csv "$M" dexMonitor)
              run_frontend=true
            fi
            if path_changed '^dexUnifiedApi(/|$)'; then
              S=$(add_csv "$S" tor); S=$(add_csv "$S" bisq); S=$(add_csv "$S" bisq2)
              S=$(add_csv "$S" unified-api); S=$(add_csv "$S" unified-snapshot); S=$(add_csv "$S" postgres-backup)
              M=$(add_csv "$M" dexUnifiedApi)
            fi
            if path_changed '^dexMonitor(/|$)'; then
              S=$(add_csv "$S" dexmonitor); M=$(add_csv "$M" dexMonitor); run_frontend=true
            fi
            if path_changed '^dexMmController(/|$)'; then
              S=$(add_csv "$S" mm-controller); M=$(add_csv "$M" dexMmController)
            fi
            if path_changed '^dexFiatController(/|$)'; then
              S=$(add_csv "$S" fiat-controller); S=$(add_csv "$S" totp-api); M=$(add_csv "$M" dexFiatController)
            fi
            if $run_frontend; then write_outputs "$S" "$M" "true"; else write_outputs "$S" "$M" "false"; fi
          }

          if [ "${EVENT:-}" = "workflow_dispatch" ]; then emit_all "manual trigger -> build all"; exit 0; fi

          if [ "${EVENT:-}" = "pull_request" ]; then BASE="${PR_BASE:-}"; HEAD="${PR_HEAD:-}"
          else BASE="${BEFORE:-}"; HEAD="${AFTER:-}"; fi

          BASE=$(resolve_base "$BASE" "$HEAD")
          if [ -z "$BASE" ]; then emit_all "no usable base commit -> build all"; exit 0; fi

          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          echo "diff range: ${BASE}..${HEAD}"
          echo "changed paths:"
          printf '%s\n' "$CHANGED"

          changed() { printf '%s\n' "$CHANGED" | grep -qE "$1"; }
          if changed '^(docker-compose\.yml|\.gitea/workflows/ci\.yml|\.gitmodules|go\.work|go\.work\.sum)$'; then
            emit_all "infra change -> build all"; exit 0
          fi

          map_paths "$CHANGED"

      # Gitea act often leaves github.ref empty when evaluating downstream job `if`
      # expressions; resolve deploy intent once here from every context field act sets.
      - name: Detect main-branch deploy
        id: deploy
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_BRANCH: ${{ github.head_branch }}
        run: |
          deploy=false
          if [ "$EVENT" = "push" ]; then
            [ "$REF" = "refs/heads/main" ] && deploy=true
            [ "${REF_NAME:-}" = "main" ] && deploy=true
            [ "${HEAD_BRANCH:-}" = "main" ] && deploy=true
          fi
          echo "main=${deploy}" >> "$GITHUB_OUTPUT"
          echo "deploy_main: event=${EVENT} ref=${REF} ref_name=${REF_NAME} head_branch=${HEAD_BRANCH} -> ${deploy}"

  test-go:
    name: Go tests (${{ matrix.module }})
    needs: detect-changes
    if: needs.detect-changes.outputs.test_modules != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Gitea act does not fan out fromJson(needs.*.outputs) matrices — keep a
      # static list and skip unchanged modules per job (see build-and-push).
      matrix:
        module: [commons, dexUnifiedApi, dexMmController, dexMonitor, dexFiatController]
    steps:
      - name: Check if this module needs testing
        id: check
        env:
          MODULES: ${{ needs.detect-changes.outputs.test_modules }}
          MODULE: ${{ matrix.module }}
        run: |
          if case ",$MODULES," in *",$MODULE,"*) true;; *) false;; esac; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "$MODULE -> testing"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "$MODULE unchanged -> skipping"
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.run == 'true'
      - name: Fetch submodules from the Gitea mirror
        if: steps.check.outputs.run == 'true'
        run: |
          host="${REGISTRY_URL#*://}"; scheme="${REGISTRY_URL%%://*}"
          git config --global url."${scheme}://x-access-token:${REG_TOKEN}@${host}/${OWNER}/".insteadOf "https://github.com/kv055/"
          git submodule update --init --recursive
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REG_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          OWNER: ${{ github.repository_owner }}

      - uses: actions/setup-go@v6
        if: steps.check.outputs.run == 'true'
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Run tests
        if: steps.check.outputs.run == 'true'
        working-directory: ${{ matrix.module }}
        run: go test ./...

  bisq-patches-apply:
    # Fast guard (seconds, not the full image build): prove the bisq source
    # patches still apply against the pinned BISQ_VERSION. Mirrors the job of
    # the same name in .github/workflows/ci-cd.yml — without it, a patch that
    # no longer applies is only caught deep inside the from-source bisq build.
    name: Bisq patches apply cleanly
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.changes, 'bisq')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch submodules from the Gitea mirror
        run: |
          host="${REGISTRY_URL#*://}"; scheme="${REGISTRY_URL%%://*}"
          git config --global url."${scheme}://x-access-token:${REG_TOKEN}@${host}/${OWNER}/".insteadOf "https://github.com/kv055/"
          git submodule update --init --recursive dexUnifiedApi
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REG_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          OWNER: ${{ github.repository_owner }}

      - name: Clone pinned bisq and apply patches
        run: |
          set -Eeuo pipefail
          version=$(grep -m1 -oP '^ARG BISQ_VERSION=\K[0-9]+\.[0-9]+\.[0-9]+' dexUnifiedApi/Dockerfile.bisq)
          echo "Checking patches against bisq v${version}"
          # bisq-network is NOT rewritten by the mirror insteadOf (kv055 only),
          # so this clone goes to real github.com.
          git clone --depth 1 --branch "v${version}" https://github.com/bisq-network/bisq.git /tmp/bisq
          cd /tmp/bisq
          for p in "$GITHUB_WORKSPACE"/dexUnifiedApi/bisq-patches/*.patch; do
            echo "applying $(basename "$p")"
            git apply --3way "$p"
          done
          echo "All patches apply cleanly against v${version}."

  test-frontend:
    name: Frontend tests
    needs: detect-changes
    if: needs.detect-changes.outputs.run_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dexMonitor/react-frontend
    steps:
      - uses: actions/checkout@v5
      - name: Fetch submodules from the Gitea mirror
        working-directory: ${{ github.workspace }}
        run: |
          host="${REGISTRY_URL#*://}"; scheme="${REGISTRY_URL%%://*}"
          git config --global url."${scheme}://x-access-token:${REG_TOKEN}@${host}/${OWNER}/".insteadOf "https://github.com/kv055/"
          git submodule update --init --recursive
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REG_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          OWNER: ${{ github.repository_owner }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dexMonitor/react-frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (tsc + vite)
        run: npm run build

  build-and-push:
    name: Build & push ${{ matrix.service }}
    needs: [detect-changes, test-go, test-frontend]
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.changes != ''
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILD_SUMMARY: "false"
    strategy:
      fail-fast: false
      # Gitea act does not fan out fromJson(needs.*.outputs) matrices — keep a
      # static list and skip unchanged services per job.
      matrix:
        include:
          - service: tor
            context: ./dexUnifiedApi
            dockerfile: dexUnifiedApi/Dockerfile.tor
          - service: bisq
            context: ./dexUnifiedApi
            dockerfile: dexUnifiedApi/Dockerfile.bisq
          - service: bisq2
            context: ./dexUnifiedApi
            dockerfile: dexUnifiedApi/Dockerfile.bisq2
          - service: unified-api
            context: .
            dockerfile: dexUnifiedApi/Dockerfile
          - service: unified-snapshot
            context: .
            dockerfile: dexUnifiedApi/Dockerfile.snapshot
          - service: postgres-backup
            context: .
            dockerfile: dexUnifiedApi/Dockerfile.backup
          - service: dexmonitor
            context: .
            dockerfile: dexMonitor/Dockerfile
          - service: mm-controller
            context: .
            dockerfile: dexMmController/Dockerfile
          - service: totp-api
            context: ./dexFiatController/services/totp-api
            dockerfile: dexFiatController/services/totp-api/Dockerfile
          - service: fiat-controller
            context: .
            dockerfile: dexFiatController/Dockerfile
    steps:
      - name: Check if this service needs building
        id: check
        env:
          CHANGES: ${{ needs.detect-changes.outputs.changes }}
          SERVICE: ${{ matrix.service }}
        run: |
          if case ",$CHANGES," in *",$SERVICE,"*) true;; *) false;; esac; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "$SERVICE changed -> building"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "$SERVICE unchanged -> skipping build"
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.build == 'true'
      - name: Fetch submodules from the Gitea mirror
        if: steps.check.outputs.build == 'true'
        run: |
          host="${REGISTRY_URL#*://}"; scheme="${REGISTRY_URL%%://*}"
          git config --global url."${scheme}://x-access-token:${REG_TOKEN}@${host}/${OWNER}/".insteadOf "https://github.com/kv055/"
          git submodule update --init --recursive
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REG_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          OWNER: ${{ github.repository_owner }}

      - name: Resolve registry + build metadata
        if: steps.check.outputs.build == 'true'
        id: reg
        env:
          URL: ${{ secrets.REGISTRY_URL }}
          REF: ${{ github.ref }}
        run: |
          gitea_host="${URL#*://}"; scheme="${URL%%://*}"
          echo "commit_hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "commit_date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

          if [ "$REF" = "refs/heads/main" ]; then
            echo "registry=ghcr.io" >> "$GITHUB_OUTPUT"
            echo "image_owner=kv055" >> "$GITHUB_OUTPUT"
          else
            echo "registry=$gitea_host" >> "$GITHUB_OUTPUT"
            echo "image_owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
            if [ "$scheme" = "http" ]; then
              printf '[registry."%s"]\n  http = true\n  insecure = true\n' "$gitea_host" > /tmp/buildkitd.toml
            else
              printf '[registry."%s"]\n  insecure = true\n' "$gitea_host" > /tmp/buildkitd.toml
            fi
          fi

      - name: Prune orphaned buildx builders
        if: steps.check.outputs.build == 'true'
        run: |
          docker ps -a --filter "name=buildx_buildkit_" --format "{{.Names}}" \
            | grep -v "ci-builder0" \
            | xargs -r docker rm -f || true
          docker volume ls -q --filter "name=buildx_buildkit_" \
            | grep -v "ci-builder0" \
            | xargs -r docker volume rm || true

      - name: Create buildx builder (Gitea-registry aware)
        if: steps.check.outputs.build == 'true'
        env:
          URL: ${{ secrets.REGISTRY_URL }}
          REF: ${{ github.ref }}
        run: |
          # Gitea act executes each step in a fresh job container. Build the
          # registry config here, immediately before Buildx consumes it; a
          # /tmp file created by the preceding metadata step does not persist.
          docker buildx use ci-builder 2>/dev/null && exit 0
          if [ "$REF" = "refs/heads/main" ]; then
            docker buildx create --name ci-builder --use --driver docker-container
          else
            gitea_host="${URL#*://}"; scheme="${URL%%://*}"
            if [ "$scheme" = "http" ]; then
              printf '[registry."%s"]\n  http = true\n  insecure = true\n' "$gitea_host" > /tmp/buildkitd.toml
            else
              printf '[registry."%s"]\n  insecure = true\n' "$gitea_host" > /tmp/buildkitd.toml
            fi
            docker buildx create --name ci-builder --use --driver docker-container --config /tmp/buildkitd.toml
          fi

      - name: Login to Gitea registry
        if: steps.check.outputs.build == 'true' && needs.detect-changes.outputs.deploy_main != 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.reg.outputs.registry }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Login to GHCR
        if: steps.check.outputs.build == 'true' && needs.detect-changes.outputs.deploy_main == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: kv055
          password: ${{ secrets.GH_PAT }}

      - uses: docker/build-push-action@v7
        if: steps.check.outputs.build == 'true'
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: |
            COMMIT_HASH=${{ steps.reg.outputs.commit_hash }}
            COMMIT_DATE=${{ steps.reg.outputs.commit_date }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.reg.outputs.registry }}/${{ steps.reg.outputs.image_owner }}/dexarbtrading-${{ matrix.service }}:latest
            ${{ steps.reg.outputs.registry }}/${{ steps.reg.outputs.image_owner }}/dexarbtrading-${{ matrix.service }}:${{ github.sha }}
          # Registry-backed layer cache (gha cache backend doesn't exist on Gitea).
          # Matters most for bisq/bisq2: without it every run rebuilds the Bisq
          # daemon from source (git clone + full gradle compile).
          cache-from: type=registry,ref=${{ steps.reg.outputs.registry }}/${{ steps.reg.outputs.image_owner }}/dexarbtrading-${{ matrix.service }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}/dexarbtrading-{2}:buildcache,mode=max', steps.reg.outputs.registry, steps.reg.outputs.image_owner, matrix.service) || '' }}

  retag-images:
    name: Re-tag ${{ matrix.service }}
    needs: [detect-changes, test-go, test-frontend]
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.deploy_main == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [tor, bisq, bisq2, unified-api, unified-snapshot, postgres-backup, dexmonitor, mm-controller, totp-api, fiat-controller]
    steps:
      # Unchanged services still need a SHA-tagged image so pre-deploy's manifest check
      # and deploy's `compose pull` succeed. Copy :latest -> :<sha> in GHCR.
      - name: Check if this service needs re-tagging
        id: check
        env:
          CHANGES: ${{ needs.detect-changes.outputs.changes }}
          SERVICE: ${{ matrix.service }}
        run: |
          if case ",$CHANGES," in *",$SERVICE,"*) true;; *) false;; esac; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "$SERVICE changed -> skip re-tag"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "$SERVICE unchanged -> re-tagging :latest to :$GITHUB_SHA"
          fi

      - name: Re-tag latest as SHA (unchanged service)
        if: steps.check.outputs.run == 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          echo "$GH_PAT" | docker login ghcr.io -u kv055 --password-stdin
          IMG="ghcr.io/kv055/dexarbtrading-${{ matrix.service }}"
          if ! docker buildx imagetools inspect "$IMG:latest" >/dev/null 2>&1; then
            echo "::error::no $IMG:latest to re-tag — run the workflow manually once to build all services"
            exit 1
          fi
          docker buildx imagetools create --tag "$IMG:$SHA" "$IMG:latest"
          echo "re-tagged $IMG:latest -> :$SHA"

  pre-deploy:
    name: Pre-deploy checks
    needs: [detect-changes, build-and-push, retag-images]
    if: |
      always() &&
      needs.detect-changes.outputs.deploy_main == 'true' &&
      needs.build-and-push.result == 'success' &&
      (needs.retag-images.result == 'success' || needs.retag-images.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVICES: tor bisq bisq2 unified-api unified-snapshot postgres-backup dexmonitor mm-controller totp-api fiat-controller
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: kv055
          password: ${{ secrets.GH_PAT }}

      - name: Verify all image SHA tags exist in GHCR
        env:
          SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          for svc in $SERVICES; do
            tag="ghcr.io/kv055/dexarbtrading-${svc}:${SHA}"
            echo "checking $tag"
            docker manifest inspect "$tag" >/dev/null
          done

      - name: Install SSH key & known_hosts
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%b\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%b\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Egress reachability check (VPS)
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" "bash -s" <<'REMOTE'
          set -Eeuo pipefail

          check_ws() {
            local url="$1"
            local key
            key=$(openssl rand -base64 16)
            local out curl_exit=0
            out=$(curl -sS --http1.1 --include --max-time 10 \
                -H "Connection: Upgrade" \
                -H "Upgrade: websocket" \
                -H "Sec-WebSocket-Key: $key" \
                -H "Sec-WebSocket-Version: 13" \
                "$url" 2>&1) || curl_exit=$?
            if [ "$curl_exit" -ne 0 ] && [ "$curl_exit" -ne 28 ]; then
              echo "WSS unreachable: $url"
              printf '%s\n' "$out" | head -5
              return 1
            fi
            if ! printf '%s\n' "$out" | grep -q ' 101 '; then
              echo "WSS no 101 upgrade: $url"
              printf '%s\n' "$out" | head -5
              return 1
            fi
            echo "ok wss $url"
          }

          check_https() {
            local url="$1"
            if ! curl -fsS --max-time 10 "$url" >/dev/null; then
              echo "HTTPS unreachable: $url"
              return 1
            fi
            echo "ok https $url"
          }

          check_ws    "https://ws.kraken.com/v2"
          check_ws    "https://ws.bitstamp.net/"
          check_ws    "https://advanced-trade-ws.coinbase.com/"
          check_https "https://api.kraken.com/0/public/SystemStatus"

          echo "egress reachability ok"
          REMOTE

      - name: VPS health checks
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          REPO_DIR: ${{ secrets.VPS_REPO_DIR }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" "REPO_DIR='$REPO_DIR' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          docker info >/dev/null
          docker compose version >/dev/null
          test -d "$REPO_DIR" || { echo "missing repo dir $REPO_DIR on VPS"; exit 1; }
          docker_root=$(docker info --format '{{.DockerRootDir}}' 2>/dev/null || echo /var/lib/docker)
          free_kb=$(df -P "$docker_root" | awk 'NR==2 {print $4}')
          [ "$free_kb" -gt 5242880 ] || { echo "low disk on $docker_root: $((free_kb/1024)) MB free, need >= 5120"; exit 1; }
          echo "health checks ok"
          REMOTE

  deploy:
    name: Deploy
    needs: [detect-changes, pre-deploy]
    if: |
      always() &&
      needs.detect-changes.outputs.deploy_main == 'true' &&
      needs.pre-deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the commit pushed to the VPS repo carries every object the
          # VPS lacks (git's receive-pack connectivity check needs the ancestry).
          fetch-depth: 0
      - name: Fetch submodules from the Gitea mirror
        run: |
          host="${REGISTRY_URL#*://}"; scheme="${REGISTRY_URL%%://*}"
          git config --global url."${scheme}://x-access-token:${REG_TOKEN}@${host}/${OWNER}/".insteadOf "https://github.com/kv055/"
          git submodule update --init --recursive
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REG_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          OWNER: ${{ github.repository_owner }}

      - name: Install SSH key & known_hosts
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%b\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%b\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Decrypt env files and upload to VPS
        timeout-minutes: 3
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          REPO_DIR: ${{ secrets.VPS_REPO_DIR }}
          KEY_ROOT:            ${{ secrets.DOTENV_PRIVATE_KEY_ROOT }}
          KEY_UNIFIED_API:     ${{ secrets.DOTENV_PRIVATE_KEY_UNIFIED_API }}
          KEY_MONITOR:         ${{ secrets.DOTENV_PRIVATE_KEY_MONITOR }}
          KEY_MM_CONTROLLER:   ${{ secrets.DOTENV_PRIVATE_KEY_MM_CONTROLLER }}
          KEY_FIAT_CONTROLLER: ${{ secrets.DOTENV_PRIVATE_KEY_FIAT_CONTROLLER }}
        run: |
          set -Eeuo pipefail
          for f in .env.enc dexUnifiedApi/.env.enc dexMonitor/.env.enc dexMmController/.env.enc dexFiatController/.env.enc; do
            test -f "$f" || { echo "Missing $f — run: cp .env .env.enc && dotenvx encrypt -f .env.enc in each directory, then commit"; exit 1; }
          done
          curl -sfS https://dotenvx.sh | sh
          # Decrypt each .env.enc in place; fail fast with a clear diagnostic if the
          # committed pubkey doesn't match the CI secret — usual cause is the post-commit
          # encrypt-env.sh hook rotating the keypair. See project_dotenvx_hook_rekey.
          decrypt_or_die () {
            local f="$1" key="$2" secret="$3"
            if ! DOTENV_PRIVATE_KEY_ENC="$key" dotenvx decrypt -f "$f" >/dev/null 2>&1; then
              local pub; pub=$(grep -oE 'DOTENV_PUBLIC_KEY_ENC="[0-9a-f]+"' "$f" | head -1 || true)
              echo "::error::Cannot decrypt $f with secret $secret."
              echo "  Committed ${pub:-<no pubkey>} does not match that key. Likely the post-commit"
              echo "  encrypt-env.sh hook rotated the keypair (new privkey only lands in gitignored .env.keys)."
              echo "  Fix: re-encrypt $f pinned to the pubkey matching $secret, or rotate that secret."
              exit 1
            fi
          }
          decrypt_or_die .env.enc                   "$KEY_ROOT"            DOTENV_PRIVATE_KEY_ROOT
          decrypt_or_die dexUnifiedApi/.env.enc     "$KEY_UNIFIED_API"     DOTENV_PRIVATE_KEY_UNIFIED_API
          decrypt_or_die dexMonitor/.env.enc        "$KEY_MONITOR"         DOTENV_PRIVATE_KEY_MONITOR
          decrypt_or_die dexMmController/.env.enc   "$KEY_MM_CONTROLLER"   DOTENV_PRIVATE_KEY_MM_CONTROLLER
          decrypt_or_die dexFiatController/.env.enc "$KEY_FIAT_CONTROLLER" DOTENV_PRIVATE_KEY_FIAT_CONTROLLER
          scp -i ~/.ssh/id_ed25519 .env.enc                  "$SSH_USER@$SSH_HOST:$REPO_DIR/.env"
          scp -i ~/.ssh/id_ed25519 dexUnifiedApi/.env.enc    "$SSH_USER@$SSH_HOST:$REPO_DIR/dexUnifiedApi/.env"
          scp -i ~/.ssh/id_ed25519 dexMonitor/.env.enc       "$SSH_USER@$SSH_HOST:$REPO_DIR/dexMonitor/.env"
          scp -i ~/.ssh/id_ed25519 dexMmController/.env.enc  "$SSH_USER@$SSH_HOST:$REPO_DIR/dexMmController/.env"
          scp -i ~/.ssh/id_ed25519 dexFiatController/.env.enc "$SSH_USER@$SSH_HOST:$REPO_DIR/dexFiatController/.env"
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" "chmod 600 \
            '$REPO_DIR/.env' \
            '$REPO_DIR/dexUnifiedApi/.env' \
            '$REPO_DIR/dexMonitor/.env' \
            '$REPO_DIR/dexMmController/.env' \
            '$REPO_DIR/dexFiatController/.env'"

      - name: Push deploy commit into the VPS repo
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          REPO_DIR: ${{ secrets.VPS_REPO_DIR }}
          NEW_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          # GitHub Actions is disabled on this repo (billing), so the VPS cannot pull this
          # commit from GitHub. Deliver the exact built commit straight from the runner's
          # checkout into the VPS git repo over the existing SSH channel; the remote
          # sync_tree then checks it out locally with no GitHub dependency. Pushed to a
          # per-SHA ref under refs/deploy/* (never a checked-out branch, so receive-pack's
          # denyCurrentBranch can't reject it) — this also keeps the previous deploy's
          # commit reachable for the auto-rollback path.
          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/id_ed25519" \
            git push --force "ssh://$SSH_USER@$SSH_HOST$REPO_DIR" "HEAD:refs/deploy/$NEW_SHA"

      - name: Sync VPS repo to commit, restart stack & verify (auto-rollback on failure)
        timeout-minutes: 10
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          REPO_DIR: ${{ secrets.VPS_REPO_DIR }}
          GHCR_TOKEN: ${{ secrets.GH_PAT }}
          GHCR_USER: kv055
          NEW_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" \
            "REPO_DIR='$REPO_DIR' GHCR_TOKEN='$GHCR_TOKEN' GHCR_USER='$GHCR_USER' NEW_SHA='$NEW_SHA' CERT_CN='dexmonitor.live' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          cd "$REPO_DIR"

          PREV_SHA=$(cat .deployed_sha 2>/dev/null || true)

          RECREATE_SERVICES="grafana prometheus loki tempo alloy nginx"

          docker run --rm -v "$REPO_DIR:/d" busybox:1.37 \
            chown -R "$(id -u):$(id -g)" /d/deploy /d/nginx 2>/dev/null || true

          # The deploy commit is delivered into this repo by the runner's "Push deploy
          # commit into the VPS repo" step (refs/deploy/<sha>); the previous deploy's
          # commit is still present for rollback. So just check it out — no remote fetch.
          sync_tree() {
            git checkout --force --detach "$1"
          }

          deploy() {
            sync_tree "$1" || { echo "::error::commit $1 not present in VPS repo — tree delivery failed"; return 1; }
            if [ -f deploy/nginx/gen-self-signed-cert.sh ]; then
              ENSURE=1 CERT_CN="${CERT_CN:-localhost}" bash deploy/nginx/gen-self-signed-cert.sh "${CERT_CN:-localhost}"
            fi
            if grep -q EDGE_AUTH_HTPASSWD docker-compose.yml 2>/dev/null; then
              if ! grep -Eq '^EDGE_AUTH_HTPASSWD=..*' .env 2>/dev/null; then
                echo "::error::EDGE_AUTH_HTPASSWD not in the deployed .env"
                return 1
              fi
            fi
            IMAGE_TAG="$1" docker compose pull
            IMAGE_TAG="$1" docker compose up -d --remove-orphans --wait --wait-timeout 300
            if [ -x deploy/nginx/letsencrypt.sh ] && grep -q '^LETSENCRYPT_EMAIL=.' .env; then
              bash deploy/nginx/letsencrypt.sh issue
            fi
            # shellcheck disable=SC2086
            IMAGE_TAG="$1" docker compose up -d --force-recreate --no-deps \
              --wait --wait-timeout 120 $RECREATE_SERVICES
          }

          edge_up() {
            local code
            code=$(curl -kso /dev/null -w '%{http_code}' --max-time 10 https://127.0.0.1/ 2>/dev/null) || code=000
            [ "$code" = 200 ] || [ "$code" = 401 ] || curl -fsSL --max-time 10 http://127.0.0.1/ >/dev/null
          }
          app_get() {
            local code
            code=$(docker compose exec -T dexmonitor curl -so /dev/null -w '%{http_code}' --max-time 30 "http://localhost:5000$1" 2>/dev/null) || code=000
            { [ "$code" = 200 ] || [ "$code" = 401 ]; } && return 0
            code=$(curl -sko /dev/null -w '%{http_code}' --max-time 30 "https://127.0.0.1$1" 2>/dev/null) || code=000
            { [ "$code" = 200 ] || [ "$code" = 401 ]; } && return 0
            code=$(curl -so /dev/null -w '%{http_code}' --max-time 30 "http://127.0.0.1$1" 2>/dev/null) || code=000
            [ "$code" = 200 ] || [ "$code" = 401 ]
          }
          smoke() {
            local name probe ok attempt
            for entry in \
              "unified-api /health::curl -fsSL --max-time 10 http://127.0.0.1:5010/health" \
              "web edge::edge_up" \
              "general_stats overview::app_get '/api/general_stats/overview?hours=24&cex=kraken'" \
              "ohlc::app_get '/api/ohlc?hours=24&cex=kraken'"; do
              name="${entry%%::*}"; probe="${entry#*::}"
              ok=""
              for attempt in 1 2 3; do
                if eval "$probe" >/dev/null 2>&1; then ok=1; break; fi
                echo "smoke attempt $attempt failed for $name"
                [ "$attempt" -lt 3 ] && sleep 5 || true
              done
              [ -n "$ok" ] || { echo "smoke test failed: $name"; return 1; }
              echo "ok $name"
            done
          }

          dump_failing_logs() {
            echo "--- container logs for failing services ---"
            for svc in $(IMAGE_TAG="$1" docker compose ps --format '{{.Name}} {{.State}}' 2>/dev/null \
                         | awk '$2 != "running" {print $1}'); do
              echo "=== $svc ==="
              docker logs --tail 80 "$svc" 2>&1 || true
            done
            echo "--- all container states ---"
            IMAGE_TAG="$1" docker compose ps 2>/dev/null || true
          }

          if deploy "$NEW_SHA" && smoke; then
            echo "$NEW_SHA" > .deployed_sha
            echo "deploy of $NEW_SHA healthy"
          else
            dump_failing_logs "$NEW_SHA"
            echo "::error::deploy of $NEW_SHA failed — rolling back to ${PREV_SHA:-<none>}"
            if [ -n "${PREV_SHA:-}" ]; then
              if deploy "$PREV_SHA" && smoke; then
                echo "::warning::rolled back to last-good $PREV_SHA"
              else
                echo "::error::ROLLBACK to $PREV_SHA FAILED — manual intervention required"
              fi
            else
              echo "::error::no previous SHA recorded — cannot auto-roll back"
            fi
            exit 1
          fi
          REMOTE
