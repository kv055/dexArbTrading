x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    logging: *default-logging
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_ADMIN_USER}
      - POSTGRES_PASSWORD=${POSTGRES_ADMIN_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    restart: unless-stopped

  tor:
    logging: *default-logging
    image: dexarbtrading/tor
    build:
      context: ./dexUnifiedApi
      dockerfile: Dockerfile.tor
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD", "curl", "-sf", "--socks5", "127.0.0.1:9050", "http://example.com"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    restart: unless-stopped

  bisq:
    logging: *default-logging
    image: dexarbtrading/bisq
    build:
      context: ./dexUnifiedApi
      dockerfile: Dockerfile.bisq
    depends_on:
      tor:
        condition: service_healthy
      postgres:
        condition: service_healthy
      unified-api:
        condition: service_healthy
    environment:
      - BISQ_VERSION=1.9.22
      - BISQ_ACCOUNT_PROVIDER=bisq
      - BISQ_SEED_BACKUP_DATABASE_URL=postgres://dex_unified_api:${POSTGRES_UNIFIED_API_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - BISQ_WALLET_PASSWORD=${BISQ_WALLET_PASSWORD:-}
    volumes:
      - bisq-data:/home/appuser/.local/share/Bisq
    deploy:
      resources:
        limits:
          memory: 3072M
          cpus: '1.5'
    restart: unless-stopped

  unified-api:
    logging: *default-logging
    image: dexarbtrading/unified-api
    build:
      context: ./dexUnifiedApi
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      tor:
        condition: service_healthy
    env_file:
      - ./dexUnifiedApi/.env
    ports:
      - "5010:5010"
    environment:
      - DATABASE_URL=postgres://dex_unified_api:${POSTGRES_UNIFIED_API_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - POSTGRES_HOST=postgres
      - LISTEN_ADDR=:5010
      - TOR_PROXY_ADDR=tor:9050
    volumes:
      - ./dexUnifiedApi/.env:/app/.env:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
    restart: unless-stopped

  unified-snapshot:
    logging: *default-logging
    image: dexarbtrading/unified-snapshot
    build:
      context: ./dexUnifiedApi
      dockerfile: Dockerfile.snapshot
    depends_on:
      bisq:
        condition: service_started
      postgres:
        condition: service_healthy
      tor:
        condition: service_healthy
      unified-api:
        condition: service_healthy
    env_file:
      - ./dexUnifiedApi/.env
    environment:
      - DATABASE_URL=postgres://dex_unified_api:${POSTGRES_UNIFIED_API_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - POSTGRES_HOST=postgres
      - BISQ_GRPC_HOST=bisq:9998
      - PRICE_PROVIDER=bisq_tor
      - SNAPSHOT_INTERVAL_MIN=1
      - SNAPSHOT_HEALTH_MAX_AGE_SEC=180
      - SERVER_INTERNAL_URL=http://unified-api:5010
      - TOR_PROXY_URL=socks5h://tor:9050
    volumes:
      - ./dexUnifiedApi/.env:/app/.env:ro
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
    restart: unless-stopped

  app:
    logging: *default-logging
    image: dexarbtrading/app
    build:
      context: ./dexMonitor
      dockerfile: Dockerfile
    depends_on:
      unified-api:
        condition: service_healthy
    env_file:
      - ./dexMonitor/.env
    environment:
      - DATABASE_URL=postgres://dex_monitor:${POSTGRES_MONITOR_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - SNAPSHOT_INTERVAL_MIN=1
      - FRONTEND_DIR=/app/react-frontend/dist
      - MM_CONTROLLER_API_URL=http://mm-controller:5001
      - TOR_PROXY_ADDR=tor:9050
      # - LND_HOST=https://localhost:8080
      # - LND_MACAROON_PATH=/lnd/admin.macaroon
      # - LND_TLS_CERT_PATH=/lnd/tls.cert
      # - LND_WALLET_PASSWORD=${LND_WALLET_PASSWORD}
    # - lnd-data:/lnd:ro  # read-only access to macaroon + tls cert
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
    restart: unless-stopped

  nginx:
    logging: *default-logging
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "5000:80"
    depends_on:
      app:
        condition: service_healthy
      unified-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: '0.1'
    restart: unless-stopped

