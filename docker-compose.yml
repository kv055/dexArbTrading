  prometheus:
    logging: *default-logging
    image: prom/prometheus:v2.55.1
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    restart: unless-stopped

  grafana:
    logging: *default-logging
    image: grafana/grafana:11.3.0
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      # Read-only Postgres datasource credentials, interpolated into
      # provisioning/datasources/postgres.yml by Grafana. The dex_grafana_ro
      # role is bootstrapped by unified-api when the password is set.
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_GRAFANA_RO_PASSWORD=${POSTGRES_GRAFANA_RO_PASSWORD:-}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: '0.25'
    restart: unless-stopped

  node-exporter:
    logging: *default-logging
    image: prom/node-exporter:v1.8.2
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|var/lib/docker/.+)($$|/)
    volumes:
      - /:/host:ro,rslave
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'
    restart: unless-stopped

  cadvisor:
    logging: *default-logging
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    restart: unless-stopped

  postgres-exporter:
    logging: *default-logging
    image: prometheuscommunity/postgres-exporter:v0.16.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATA_SOURCE_NAME=postgres://${POSTGRES_ADMIN_USER}:${POSTGRES_ADMIN_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    command:
      - --no-collector.stat_bgwriter
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'
    restart: unless-stopped

  # --- OpenTelemetry log + trace backend (viewed via the existing Grafana) ---

  loki:
    logging: *default-logging
    image: grafana/loki:3.3.2
    command:
      - -config.file=/etc/loki/config.yml
    volumes:
      - ./deploy/monitoring/loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    restart: unless-stopped

  tempo:
    logging: *default-logging
    image: grafana/tempo:2.7.1
    command:
      - -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./deploy/monitoring/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    deploy:
      resources:
        limits:
          # 384M not the agent's proposed 192M: tempo OOM-killed at 259M RSS, so
          # 192M would crash it again. The other monitoring reductions are kept.
          memory: 384M
          cpus: '0.5'
    restart: unless-stopped

  alloy:
    logging: *default-logging
    image: grafana/alloy:v1.5.1
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./deploy/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      # Read-only docker socket for container log discovery. See the security
      # note in deploy/monitoring/alloy/config.alloy.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
      - tempo
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    restart: unless-stopped

