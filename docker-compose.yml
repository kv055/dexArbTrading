  app:
    logging: *default-logging
    image: ghcr.io/${IMAGE_OWNER:-kv055}/dexarbtrading-app:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: dexMonitor/Dockerfile
    depends_on:
      unified-api:
        condition: service_healthy
    env_file:
      - ./dexMonitor/.env
    environment:
      - DATABASE_URL=postgres://dex_monitor:${POSTGRES_MONITOR_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - SNAPSHOT_INTERVAL_MIN=1
      - FRONTEND_DIR=/app/react-frontend/dist
      - MM_CONTROLLER_API_URL=http://host.docker.internal:5001
      - UNIFIED_API_URL=http://unified-api:5010
      - TOR_PROXY_ADDR=tor:9050
      - BISQ_GRPC_HOST=bisq:9998
      - BISQ_API_PASSWORD=${BISQ_API_PASSWORD:-}
      # - LND_HOST=https://localhost:8080
      # - LND_MACAROON_PATH=/lnd/admin.macaroon
      # - LND_TLS_CERT_PATH=/lnd/tls.cert
      # - LND_WALLET_PASSWORD=${LND_WALLET_PASSWORD}
    # - lnd-data:/lnd:ro  # read-only access to macaroon + tls cert
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # See unified-api: generous start window to avoid false-unhealthy under load.
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  nginx:
    logging: *default-logging
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "5000:80"
    depends_on:
      app:
        condition: service_healthy
      unified-api:
        condition: service_healthy
      grafana:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: '0.1'
    restart: unless-stopped

