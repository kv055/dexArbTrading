# Pin the compose project name so named-volume prefixes (e.g. postgres-data)
# stay stable regardless of which directory `docker compose up` is run from.
# Without this, running compose from a worktree dir mints brand-new empty
# volumes under a different project prefix and the real data looks "wiped".
name: dexarbtrading

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    logging: *default-logging
    image: postgres:17-alpine
    ports:
      # Bind to loopback only: reachable from the VPS host (so the DBeaver SSH
      # tunnel can forward to it) and from the docker network (services use the
      # postgres:5432 DNS name), but never exposed on the public interface.
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_ADMIN_USER}
      - POSTGRES_PASSWORD=${POSTGRES_ADMIN_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    restart: unless-stopped

  tor:
    logging: *default-logging
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-kv055}/dexarbtrading-tor:${IMAGE_TAG:-latest}
    build:
      context: ./dexUnifiedApi
      dockerfile: Dockerfile.tor
    ports:
      # Loopback only, for host-side debugging / curl --socks5 tests. Sibling
      # containers on the bridge network use tor:9050 directly. Override
      # TOR_SOCKS_HOST_PORT when the host already runs its own tor daemon on
      # 9050.
      - "127.0.0.1:${TOR_SOCKS_HOST_PORT:-9050}:9050"
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD", "curl", "-sf", "--socks5", "127.0.0.1:9050", "http://example.com"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    restart: unless-stopped

  bisq:
    logging: *default-logging
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-kv055}/dexarbtrading-bisq:${IMAGE_TAG:-latest}
    build:
      context: ./dexUnifiedApi
      dockerfile: Dockerfile.bisq
      # Pin the built daemon version from here (like bisq2 below). Without this
      # arg the image silently builds at the Dockerfile's ARG default and the
      # env below drifts out of sync with what actually runs.
      args:
        - BISQ_VERSION=1.10.2
    depends_on:
      tor:
        condition: service_healthy
      postgres:
        condition: service_healthy
      unified-api:
        condition: service_healthy
    environment:
      - BISQ_VERSION=1.10.2
      - BISQ_ACCOUNT_PROVIDER=Bisq
      - BISQ_ACCOUNT_FILE_PATH=${BISQ_ACCOUNT_FILE_PATH:-}
      - BISQ_BACKUP_DATABASE_URL=postgres://dex_unified_api:${POSTGRES_UNIFIED_API_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - BISQ_SEED_BACKUP_DATABASE_URL=postgres://dex_unified_api:${POSTGRES_UNIFIED_API_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - BISQ_WALLET_PASSWORD=${BISQ_WALLET_PASSWORD:-}
      # gRPC --apiPassword for :9998; must match the BISQ_API_PASSWORD the
      # client services (unified-api, snapshot, dexmonitor, mm-controller) send.
      - BISQ_API_PASSWORD=${BISQ_API_PASSWORD:-}
    volumes:
      - bisq-data:/home/appuser/.local/share/Bisq
      # Optional bring-your-own Bisq account file:
      # - ./dexUnifiedApi/bisqseed/secrets/UserPayload:/run/secrets/bisq_UserPayload:ro
      # Set BISQ_ACCOUNT_FILE_PATH=/run/secrets/bisq_UserPayload when using that mount.
    deploy:
      resources:
        limits:
          memory: 3072M
          cpus: '1.5'
    restart: unless-stopped

  bisq2:
    logging: *default-logging
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-kv055}/dexarbtrading-bisq2:${IMAGE_TAG:-latest}
    build:
      context: ./dexUnifiedApi
      dockerfile: Dockerfile.bisq2
      args:
        - BISQ2_VERSION=2.1.11
    depends_on:
      tor:
        condition: service_healthy
      postgres:
        condition: service_healthy
      unified-api:
        condition: service_healthy
    environment:
      - BISQ2_VERSION=2.1.11
      - BISQ2_ACCOUNT_FILE_PATH=${BISQ2_ACCOUNT_FILE_PATH:-}
      - BISQ2_BACKUP_DATABASE_URL=postgres://dex_unified_api:${POSTGRES_UNIFIED_API_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - BISQ2_SEED_BACKUP_DATABASE_URL=postgres://dex_unified_api:${POSTGRES_UNIFIED_API_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - BISQ2_WALLET_PASSWORD=${BISQ2_WALLET_PASSWORD:-}
    volumes:
      - bisq2-data:/home/appuser/.local/share/Bisq2
      # Optional bring-your-own Bisq 2 account file (format TBD):
      # - ./dexUnifiedApi/bisqseed/secrets/bisq2_account:/run/secrets/bisq2_account:ro
      # Set BISQ2_ACCOUNT_FILE_PATH=/run/secrets/bisq2_account when using that mount.
    ports:
      # Loopback only: host-side dev tooling / curl reaches the REST API.
      # Sibling containers use http://bisq2:8090, not this publish. The API has
      # no static-password auth in v2.1.11 (only device-pairing), so it must
      # never be published on a public interface.
      - "127.0.0.1:8090:8090"
    deploy:
      resources:
        limits:
          memory: 3072M
          cpus: '1.5'
    restart: unless-stopped

  unified-api:
    logging: *default-logging
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-kv055}/dexarbtrading-unified-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: dexUnifiedApi/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      tor:
        condition: service_healthy
    env_file:
      - ./dexUnifiedApi/.env
    ports:
      # Bind to loopback only: previously published on 0.0.0.0, which exposed
      # /internal/*, /metrics and the raw API to the public internet (bypassing
      # nginx). Loopback keeps it off the public interface while still letting the
      # local Vite dev server (vite.config.ts proxies to localhost:5010) reach it.
      # In prod nothing uses this mapping (services use the unified-api:5010 DNS
      # name); it is harmless there because loopback is not externally reachable.
      - "127.0.0.1:5010:5010"
    environment:
      - DATABASE_URL=postgres://dex_unified_api:${POSTGRES_UNIFIED_API_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - POSTGRES_HOST=postgres
      - LISTEN_ADDR=:5010
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-}
      # The internal ingest endpoints fail CLOSED when INTERNAL_API_SECRET is
      # empty. Set ALLOW_INSECURE_INTERNAL=true to intentionally run them open
      # (e.g. before a secret is provisioned); default empty = secure.
      - ALLOW_INSECURE_INTERNAL=${ALLOW_INSECURE_INTERNAL:-}
      - TOR_PROXY_ADDR=tor:9050
      - BISQ_GRPC_HOST=bisq:9998
      - BISQ_API_PASSWORD=${BISQ_API_PASSWORD:-}
      - BISQ2_REST_HOST=bisq2:8090
      - BISQ2_API_PASSWORD=${BISQ2_API_PASSWORD:-}
      - ACCOUNT_HEALTH_INTERVAL=${ACCOUNT_HEALTH_INTERVAL:-10m}
      # OpenTelemetry: traces -> Alloy -> Tempo; structured logs scraped from stdout.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-alloy:4317}
      - OTEL_SERVICE_NAME=unified-api
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-1.0}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DEPLOY_ENV=${DEPLOY_ENV:-production}
      # Validates the dashboard login session cookie; default Secure=true (prod is
      # HTTPS). Export SESSION_COOKIE_SECURE=false for local HTTP dev.
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY:-}
    volumes:
      - ./dexUnifiedApi/.env:/app/.env:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Generous start window so a slow start during a full-stack recreate on a
      # memory-constrained VPS isn't misread as unhealthy and cascaded to dependents.
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    restart: unless-stopped

  unified-snapshot:
    logging: *default-logging
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-kv055}/dexarbtrading-unified-snapshot:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: dexUnifiedApi/Dockerfile.snapshot
    depends_on:
      postgres:
        condition: service_healthy
      tor:
        condition: service_healthy
      unified-api:
        condition: service_healthy
    env_file:
      - ./dexUnifiedApi/.env
    environment:
      - DATABASE_URL=postgres://dex_unified_api:${POSTGRES_UNIFIED_API_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - POSTGRES_HOST=postgres
      - BISQ_GRPC_HOST=bisq:9998
      - BISQ_API_PASSWORD=${BISQ_API_PASSWORD:-}
      - BISQ2_REST_HOST=bisq2:8090
      - BISQ2_API_PASSWORD=${BISQ2_API_PASSWORD:-}
      - PRICE_PROVIDER=bisq_tor
      - SNAPSHOT_INTERVAL_MIN=1
      - CLOSED_OFFER_ANALYSIS_GRACE_CYCLES=3
      - SNAPSHOT_HEALTH_MAX_AGE_SEC=180
      - SERVER_INTERNAL_URL=http://unified-api:5010
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-}
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY:-}
      - TOR_PROXY_URL=socks5h://tor:9050
      # OpenTelemetry: traces -> Alloy -> Tempo; structured logs scraped from stdout.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-alloy:4317}
      - OTEL_SERVICE_NAME=unified-snapshot
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-1.0}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DEPLOY_ENV=${DEPLOY_ENV:-production}
    volumes:
      - ./dexUnifiedApi/.env:/app/.env:ro
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
    restart: unless-stopped

  # postgres-backup:
  #   logging: *default-logging
  #   image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-kv055}/dexarbtrading-postgres-backup:${IMAGE_TAG:-latest}
  #   build:
  #     context: .
  #     dockerfile: dexUnifiedApi/Dockerfile.backup
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   env_file:
  #     - ./.env
  #   environment:
  #     - POSTGRES_DB=${POSTGRES_DB}
  #     - POSTGRES_ADMIN_USER=${POSTGRES_ADMIN_USER}
  #     - POSTGRES_ADMIN_PASSWORD=${POSTGRES_ADMIN_PASSWORD}
  #     - PG_BACKUP_POSTGRES_HOST=postgres
  #     - PG_BACKUP_POSTGRES_PORT=5432
  #     - PG_BACKUP_DIR=/backups
  #     - PG_BACKUP_ENABLED=${PG_BACKUP_ENABLED:-true}
  #     - PG_BACKUP_FILE_PREFIX=${PG_BACKUP_FILE_PREFIX:-dexarb}
  #     - PG_BACKUP_INTERVAL=${PG_BACKUP_INTERVAL:-6h}
  #     - PG_BACKUP_RETENTION_DAYS=${PG_BACKUP_RETENTION_DAYS:-14}
  #     - PG_BACKUP_UPLOAD=${PG_BACKUP_UPLOAD:-true}
  #     - PG_BACKUP_UPLOAD_REQUIRED=${PG_BACKUP_UPLOAD_REQUIRED:-true}
  #     - PG_BACKUP_RCLONE_REMOTE=${PG_BACKUP_RCLONE_REMOTE:-proton:postgres-backups/dexarb}
  #     - PG_BACKUP_COMMAND_TIMEOUT=${PG_BACKUP_COMMAND_TIMEOUT:-2h}
  #   volumes:
  #     - postgres-backups:/backups
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 128M
  #         cpus: '0.25'
  #   restart: unless-stopped

  dexmonitor:
    logging: *default-logging
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-kv055}/dexarbtrading-dexmonitor:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: dexMonitor/Dockerfile
    depends_on:
      unified-api:
        condition: service_healthy
    env_file:
      - ./dexMonitor/.env
    environment:
      - DATABASE_URL=postgres://dex_monitor:${POSTGRES_MONITOR_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - SNAPSHOT_INTERVAL_MIN=1
      - FRONTEND_DIR=/app/react-frontend/dist
      - MM_CONTROLLER_API_URL=http://mm-controller:5001
      # Must match mm-controller's INTERNAL_API_SECRET: every proxied
      # /api/mm-controller/* call carries it as X-Internal-Secret.
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-}
      - UNIFIED_API_URL=http://unified-api:5010
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY:-}
      - TOR_PROXY_ADDR=tor:9050
      - BISQ_GRPC_HOST=bisq:9998
      - BISQ_API_PASSWORD=${BISQ_API_PASSWORD:-}
      # OpenTelemetry: traces -> Alloy -> Tempo; structured logs scraped from stdout.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-alloy:4317}
      - OTEL_SERVICE_NAME=dexmonitor
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-1.0}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DEPLOY_ENV=${DEPLOY_ENV:-production}
      # Login session cookie Secure attribute. Defaults to true (prod is HTTPS).
      # Export SESSION_COOKIE_SECURE=false for local HTTP dev (e.g. the Vite dev
      # server on http://localhost:5173), where browsers drop Secure cookies and
      # the session would never persist.
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
      # - LND_HOST=https://localhost:8080
      # - LND_MACAROON_PATH=/lnd/admin.macaroon
      # - LND_TLS_CERT_PATH=/lnd/tls.cert
      # LND wallet password: set accounts.password via dexMonitor (not env).
    volumes:
      # Read-only access is only used to create an operator-requested Bisq 1
      # data-directory archive for recovery in a local Bisq GUI.
      - bisq-data:/bisq-data:ro
    # - lnd-data:/lnd:ro  # read-only access to macaroon + tls cert
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # See unified-api: generous start window to avoid false-unhealthy under load.
      start_period: 40s
    deploy:
      resources:
        limits:
          # 256M still OOM-killed under dashboard burst + lifecycle aggregates;
          # 512M gives headroom while backend deduplication lands.
          memory: 512M
          cpus: '0.5'
    ports:
      - "127.0.0.1:5002:5000"
    restart: unless-stopped

  nginx:
    logging: *default-logging
    image: nginx:1.27-alpine
    # No edge basic-auth: the application enforces login (dexMonitor session
    # cookie, validated by dexMonitor and unified-api). Stock entrypoint runs nginx.
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # TLS material (gitignored, never committed). The CI deploy guard auto-creates/
      # renews it on the VPS before `up`; locally run deploy/nginx/gen-self-signed-cert.sh.
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    ports:
      # 5000 -> 80 keeps the existing plaintext entrypoint (now a 301 to HTTPS);
      # 5443 -> 443 is the TLS entrypoint agents and browsers actually use.
      - "5000:80"
      - "5443:443"
    depends_on:
      dexmonitor:
        condition: service_healthy
      unified-api:
        condition: service_healthy
      grafana:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: '0.1'
    restart: unless-stopped

  mm-controller:
    logging: *default-logging
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-kv055}/dexarbtrading-mm-controller:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: dexMmController/Dockerfile
    # Bridge network: all upstreams (lnd, tor, unified-api, bisq) are reached
    # via docker DNS, not localhost. The 127.0.0.1:5001 publish below keeps
    # host-side callers (dev tooling, curl localhost:5001) working.
    env_file:
      - ./dexMmController/.env
    depends_on:
      postgres:
        condition: service_healthy
      lnd:
        condition: service_healthy
      unified-api:
        condition: service_healthy
    environment:
      - DB_PATH=/app/mm-controller.db
      - API_ADDR=:5001
      # OpenTelemetry: traces -> Alloy -> Tempo; structured logs scraped from stdout.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-alloy:4317}
      - OTEL_SERVICE_NAME=mm-controller
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Keep the displayed daemon version available even while the encrypted
      # LND wallet is locked and /v1/getinfo cannot be queried.
      - LND_VERSION=${LND_VERSION:-0.18.4-beta}
      # Postgres reached via docker DNS. mm-controller builds DATABASE_URL from
      # POSTGRES_HOST/PORT/DB/USER/PASSWORD (see resolveDatabaseURL in main.go),
      # so the bridge-network host is set here without re-stating credentials.
      - POSTGRES_HOST=postgres
      - OPENCLAW_URL=
      # Internal traffic hits unified-api directly on the bridge network.
      # The /internal/ws/live_offers route is secret-gated (X-Internal-Secret),
      # not session-cookie-gated like the browser /ws/live_offers path — the
      # premium-offer watcher is a service-to-service caller with no cookie.
      # INTERNAL_API_SECRET must match unified-api's (root .env).
      - OFFER_PREMIUM_WSS_URL=ws://unified-api:5010/internal/ws/live_offers?cex=kraken
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-}
      - LND_HOST=https://lnd:8080
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY:-}
      - LND_MACAROON_PATH=/lnd/data/chain/bitcoin/mainnet/admin.macaroon
      - LND_TLS_CERT_PATH=/lnd/tls.cert
      # Tor SOCKS proxy reached via docker DNS instead of the host loopback.
      - TOR_PROXY_URL=socks5h://tor:9050
      # Bisq daemon on the bridge network — fixes "dial tcp 127.0.0.1:9998:
      # connection refused" seen when this service was host-networked and the
      # bisq container did not publish 9998 to the host.
      - BISQ_GRPC_HOST=bisq:9998
      - BISQ_API_PASSWORD=${BISQ_API_PASSWORD:-}
      - BISQ_VERSION=1.10.2
      - BISQ2_REST_HOST=bisq2:8090
      - BISQ2_API_PASSWORD=${BISQ2_API_PASSWORD:-}
      - BISQ2_VERSION=2.1.11
      # xprv restore disabled: wallet is generated fresh from a new aezeed seed
      # (stored in DB on first boot). Re-enable both lines + the secret mounts
      # below to restore a wallet from the extended master key instead.
      # - LND_EXTENDED_MASTER_KEY_FILE=/run/secrets/lnd_extended_master_key
      # - LND_EXTENDED_MASTER_KEY_BIRTHDAY_TIMESTAMP_FILE=/run/secrets/lnd_extended_master_key_birthday_timestamp
      - ACCOUNT_HEALTH_INTERVAL=${ACCOUNT_HEALTH_INTERVAL:-10m}
      # RoboSats coordinators are Tor onion services; reach them through the
      # tor sidecar's SOCKS port on the bridge network (tor:9050).
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - DEXMM_TELEGRAM_WEBHOOK_URL=${DEXMM_TELEGRAM_WEBHOOK_URL:-}
      # Registered as secret_token on setWebhook; inbound /telegram-webhook
      # posts are rejected unless they echo it back (fail-closed when unset).
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      # Alternative to xprv/tprv:
      # - LND_SEED_MNEMONIC_FILE=/run/secrets/lnd_seed_mnemonic
      # - LND_AEZEED_PASSPHRASE_FILE=/run/secrets/lnd_aezeed_passphrase
      # - LND_RECOVERY_WINDOW=250
    ports:
      # Loopback only: host-side dev tooling / curl reaches the API. Sibling
      # containers use http://mm-controller:5001, not this publish.
      - "127.0.0.1:5001:5001"
    volumes:
      - lnd-data:/lnd:ro
      # xprv restore disabled (see env block above):
      # - ./dexMmController/secrets/lnd_extended_master_key:/run/secrets/lnd_extended_master_key:ro
      # - ./dexMmController/secrets/lnd_extended_master_key_birthday_timestamp:/run/secrets/lnd_extended_master_key_birthday_timestamp:ro
      # Alternative to aezeed:
      # - ./dexMmController/secrets/lnd_seed_mnemonic:/run/secrets/lnd_seed_mnemonic:ro
      # - ./dexMmController/secrets/lnd_aezeed_passphrase:/run/secrets/lnd_aezeed_passphrase:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5001/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5m
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
    restart: unless-stopped

  lnd:
    logging: *default-logging
    image: lightninglabs/lnd:v${LND_VERSION:-0.18.4-beta}
    # Bridge network: reachable from sibling containers at https://lnd:8080.
    # The TLS cert must include the "lnd" SAN (added below); see the one-time
    # cert-regeneration note in the README / migration comment before first up.
    volumes:
      - lnd-data:/root/.lnd
    ports:
      # Loopback only, for host-side lncli / debugging. Sibling containers use
      # the docker DNS name (lnd:8080 / lnd:10009), not these publishes.
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:10009:10009"
    healthcheck:
      test: ["CMD", "curl", "-sf", "--cacert", "/root/.lnd/tls.cert",
             "https://localhost:8080/v1/state"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    command:
      - --bitcoin.active
      - --bitcoin.mainnet
      - --bitcoin.node=neutrino
      - --neutrino.addpeer=btcd-mainnet.lightning.computer
      - --neutrino.addpeer=neutrino.noderunner.wtf
      - --neutrino.addpeer=node.eldamar.icu
      - --neutrino.addpeer=btcd.lnolymp.us
      - --fee.url=https://nodes.lightning.computer/fees/v1/btc-fee-estimates.json
      - --restlisten=0.0.0.0:8080
      - --rpclisten=0.0.0.0:10009
      - --tlsextraip=127.0.0.1
      - --tlsextradomain=localhost
      - --tlsextradomain=lnd
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    restart: unless-stopped

  # totp-api:
  #   logging: *default-logging
  #   image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-kv055}/dexarbtrading-totp-api:${IMAGE_TAG:-latest}
  #   build:
  #     context: ./dexFiatController/services/totp-api
  #     dockerfile: Dockerfile
  #   environment:
