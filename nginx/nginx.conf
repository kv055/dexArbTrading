map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    resolver 127.0.0.11 ipv6=off valid=30s;

    # Internal-only routes must never be reachable from the public internet.
    # Without these, the catch-all "location /" below forwards them to the
    # dexMonitor app: POST /internal/live_offers is unauthenticated and writes to
    # the DB, and /metrics leaks Prometheus internals. Service-to-service calls
    # use the docker network directly and never traverse nginx, so blocking here
    # is safe. `^~` makes the prefix win over regex locations; 404 hides them.
    location ^~ /internal/ {
        return 404;
    }
    location = /metrics {
        return 404;
    }

    # Live offers WebSocket
    location /ws/live_offers {
        set $unifiedapi http://unified-api:5010;
        proxy_pass         $unifiedapi;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_read_timeout 86400s;
    }

    # Live offers REST + trade cost config
    location ~ ^/api/(live_offers|trade_cost_config) {
        set $unifiedapi http://unified-api:5010;
        proxy_pass       $unifiedapi;
        proxy_set_header Host $host;
    }

    # Grafana live (WebSocket) — must precede /grafana/ to match first
    location /grafana/api/live/ {
        set $grafana http://grafana:3000;
        proxy_pass         $grafana;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
    }

    # Grafana UI + API (sub-path mode via GF_SERVER_SERVE_FROM_SUB_PATH)
    location /grafana/ {
        set $grafana http://grafana:3000;
        proxy_pass         $grafana;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Everything else: frontend, past orders, OHLC, stats, etc.
    location / {
        set $dexmonitor http://app:5000;
        proxy_pass         $dexmonitor;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_read_timeout 120s;
    }
}
