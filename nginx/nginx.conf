upstream dexmonitor { server app:5000; }
upstream unifiedapi  { server unified-api:5010; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # Live offers WebSocket
    location /ws/live_offers {
        proxy_pass         http://unifiedapi;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_read_timeout 86400s;
    }

    # Live offers REST + trade cost config
    location ~ ^/api/(live_offers|trade_cost_config) {
        proxy_pass       http://unifiedapi;
        proxy_set_header Host $host;
    }

    # Everything else: frontend, past orders, OHLC, stats, etc.
    location / {
        proxy_pass         http://dexmonitor;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_read_timeout 120s;
    }
}
