name: Bisq version bump

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Bump from the integration branch; the bot PR also targets it, so version
          # bumps flow develop -> main through staging like every other change.
          ref: develop
          token: ${{ secrets.GH_PAT }}
          submodules: recursive

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Read current BISQ_VERSION
        id: current
        run: |
          current=$(grep -oP 'BISQ_VERSION=\K[0-9]+\.[0-9]+\.[0-9]+' docker-compose.yml | head -1)
          echo "version=$current" >> "$GITHUB_OUTPUT"

      - name: Fetch latest upstream release
        id: upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          auth_header=""
          [ -n "$GITHUB_TOKEN" ] && auth_header="-H \"Authorization: Bearer $GITHUB_TOKEN\""
          latest=$(curl -fsSL $auth_header \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/bisq-network/bisq/releases/latest" \
            | jq -r '.tag_name' | sed 's/^v//')
          echo "version=$latest" >> "$GITHUB_OUTPUT"

      - name: Decide whether to bump
        id: decide
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current="${{ steps.current.outputs.version }}"
          upstream="${{ steps.upstream.outputs.version }}"

          if [ "$current" = "$upstream" ]; then
            echo "bump=false" >> "$GITHUB_OUTPUT"
            echo "Up to date at ${current}"
            exit 0
          fi

          higher=$(printf '%s\n%s\n' "$current" "$upstream" | sort -V | tail -1)
          if [ "$higher" != "$upstream" ]; then
            echo "bump=false" >> "$GITHUB_OUTPUT"
            echo "Upstream ${upstream} is not newer than current ${current}; skipping"
            exit 0
          fi

          auth_header=""
          [ -n "$GITHUB_TOKEN" ] && auth_header="-H \"Authorization: Bearer $GITHUB_TOKEN\""
          if ! curl -fsSL -o /dev/null $auth_header \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/bisq-network/bisq/git/ref/tags/v${upstream}"; then
            echo "bump=false" >> "$GITHUB_OUTPUT"
            echo "WARNING: bisq ${upstream} has no git tag yet; skipping" >&2
            exit 0
          fi

          echo "bump=true" >> "$GITHUB_OUTPUT"

      - name: Bump submodule (dexUnifiedApi) and push
        if: steps.decide.outputs.bump == 'true'
        env:
          OLD: ${{ steps.current.outputs.version }}
          NEW: ${{ steps.upstream.outputs.version }}
        run: |
          cd dexUnifiedApi
          # submodule is checked out as detached HEAD; move to main so we can push
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          sed -i "s/ARG BISQ_VERSION=$OLD/ARG BISQ_VERSION=$NEW/g" Dockerfile.bisq
          git add Dockerfile.bisq
          git commit -m "chore(bisq): bump BISQ_VERSION ${OLD} -> ${NEW}"
          git push origin main

      - name: Open auto-merge PR for outer repo bump (submodule pointer + docker-compose.yml)
        if: steps.decide.outputs.bump == 'true'
        env:
          OLD: ${{ steps.current.outputs.version }}
          NEW: ${{ steps.upstream.outputs.version }}
          # A real PAT (not the default GITHUB_TOKEN) is required so the branch push and PR
          # actually trigger CI — GITHUB_TOKEN-created PRs do not start workflow runs.
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -Eeuo pipefail
          BRANCH="bisq-bump/${NEW}"
          sed -i "s/BISQ_VERSION=$OLD/BISQ_VERSION=$NEW/g" docker-compose.yml
          git checkout -b "$BRANCH"
          git add dexUnifiedApi docker-compose.yml
          git commit -m "chore(bisq): bump BISQ_VERSION ${OLD} -> ${NEW}"
          git push -u origin "$BRANCH" --force
          gh pr create \
            --base develop --head "$BRANCH" \
            --title "chore(bisq): bump BISQ_VERSION ${OLD} -> ${NEW}" \
            --body "Automated Bisq bump ${OLD} -> ${NEW}. The full CI pipeline (including the bisq image build) runs on this PR; it merges into develop automatically once all checks are green, then reaches prod via the usual develop -> main promotion."
          # Auto-merge once required checks pass. Requires 'Allow auto-merge' enabled on the
          # repo and a required status check on develop (e.g. the build-and-push job).
          gh pr merge "$BRANCH" --auto --squash --delete-branch
