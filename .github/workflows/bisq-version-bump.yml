name: Bisq version bump

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: recursive

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Read current BISQ_VERSION
        id: current
        run: |
          current=$(grep -oP 'BISQ_VERSION=\K[0-9]+\.[0-9]+\.[0-9]+' docker-compose.yml | head -1)
          echo "version=$current" >> "$GITHUB_OUTPUT"

      - name: Fetch latest upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(gh api repos/bisq-network/bisq/releases/latest --jq '.tag_name' | sed 's/^v//')
          echo "version=$latest" >> "$GITHUB_OUTPUT"

      - name: Decide whether to bump
        id: decide
        run: |
          if [ "${{ steps.current.outputs.version }}" = "${{ steps.upstream.outputs.version }}" ]; then
            echo "bump=false" >> "$GITHUB_OUTPUT"
          else
            higher=$(printf '%s\n%s\n' "${{ steps.current.outputs.version }}" "${{ steps.upstream.outputs.version }}" | sort -V | tail -1)
            if [ "$higher" = "${{ steps.upstream.outputs.version }}" ]; then
              echo "bump=true" >> "$GITHUB_OUTPUT"
            else
              echo "bump=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Verify upstream artifacts exist
        if: steps.decide.outputs.bump == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW: ${{ steps.upstream.outputs.version }}
        run: |
          assets=$(gh api repos/bisq-network/bisq/releases/tags/v${NEW} --jq '[.assets[].name]')
          echo "Release assets for v${NEW}: $assets"
          if ! echo "$assets" | grep -q "bisq-daemon-${NEW}.zip"; then
            echo "ERROR: bisq-daemon-${NEW}.zip not found in release assets" >&2
            exit 1
          fi
          if ! echo "$assets" | grep -q "bisq-cli-${NEW}.zip"; then
            echo "ERROR: bisq-cli-${NEW}.zip not found in release assets" >&2
            exit 1
          fi

      - name: Bump submodule (dexUnifiedApi) and push
        if: steps.decide.outputs.bump == 'true'
        env:
          OLD: ${{ steps.current.outputs.version }}
          NEW: ${{ steps.upstream.outputs.version }}
        run: |
          cd dexUnifiedApi
          # submodule is checked out as detached HEAD; move to main so we can push
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          sed -i "s/ARG BISQ_VERSION=$OLD/ARG BISQ_VERSION=$NEW/g" Dockerfile.bisq
          git add Dockerfile.bisq
          git commit -m "chore(bisq): bump BISQ_VERSION ${OLD} -> ${NEW}"
          git push origin main

      - name: Bump outer repo (submodule pointer + docker-compose.yml) and push
        if: steps.decide.outputs.bump == 'true'
        env:
          OLD: ${{ steps.current.outputs.version }}
          NEW: ${{ steps.upstream.outputs.version }}
        run: |
          sed -i "s/BISQ_VERSION=$OLD/BISQ_VERSION=$NEW/g" docker-compose.yml
          git add dexUnifiedApi docker-compose.yml
          git commit -m "chore(bisq): bump BISQ_VERSION ${OLD} -> ${NEW}"
          git push origin main
