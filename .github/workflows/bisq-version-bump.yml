name: Bisq version bump

# Nightly: detect a new upstream Bisq v1 release, verify our source patches
# (dexUnifiedApi/bisq-patches/) still apply against it, then either open the
# bump PR or — if a patch no longer applies — open/refresh a rebase issue
# instead of a PR. Detection + patch-check logic lives in
# scripts/bisq-bump-check.sh, shared with the Gitea check workflow.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check-and-bump:
    # Gitea Actions also executes .github/workflows/. This job can never work
    # there (gh CLI, GitHub PR/issue semantics), so it only runs on real GitHub;
    # the Gitea side has its own check-and-notify workflow.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Bump from the integration branch; the bot PR also targets it, so version
          # bumps flow develop -> main through staging like every other change.
          ref: develop
          token: ${{ secrets.GH_PAT }}
          submodules: recursive

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check upstream version and patch compatibility
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/bisq-bump-check.sh

      - name: Skip if a bump PR already exists
        id: dedupe
        if: steps.check.outputs.bump == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NEW: ${{ steps.check.outputs.latest }}
        run: |
          set -Eeuo pipefail
          if git ls-remote --exit-code origin "refs/heads/bisq-bump/${NEW}" >/dev/null 2>&1 \
             || [ -n "$(gh pr list --head "bisq-bump/${NEW}" --state open --json number --jq '.[].number')" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "bisq-bump/${NEW} already exists; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open/refresh rebase issue when patches no longer apply
        if: steps.check.outputs.bump == 'true' && steps.check.outputs.patches_ok == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NEW: ${{ steps.check.outputs.latest }}
          FAILED: ${{ steps.check.outputs.failed_patch }}
        run: |
          set -Eeuo pipefail
          title="bisq v${NEW}: bisq-patches need rebase"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing: \`${FAILED}\` does not apply against v${NEW}. Run: ${run_url}"
            echo "Updated existing issue #$existing"
          else
            body="Upstream Bisq **v${NEW}** is available, but \`dexUnifiedApi/bisq-patches/${FAILED}\` no longer applies (\`git apply --3way\` fails), so the automated bump PR was **not** opened."
            body+=$'\n\n'"To unblock the bump:"
            body+=$'\n'"1. Rebase the failing patch against \`v${NEW}\` (clone upstream at the tag, re-apply, regenerate the patch)."
            body+=$'\n'"2. Commit it to \`dexUnifiedApi/bisq-patches/\`."
            body+=$'\n'"3. Re-run the *Bisq version bump* workflow (workflow_dispatch) or wait for the nightly run."
            body+=$'\n\n'"The image build (\`Dockerfile.bisq\`) applies these patches with \`git apply --3way\` and would fail at the same point."
            body+=$'\n\n'"Detected by: ${run_url}"
            gh issue create --title "$title" --body "$body"
          fi

      - name: Bump submodule (dexUnifiedApi) and push
        if: steps.check.outputs.bump == 'true' && steps.check.outputs.patches_ok == 'true' && steps.dedupe.outputs.exists == 'false'
        env:
          NEW: ${{ steps.check.outputs.latest }}
          NEW_COMMIT: ${{ steps.check.outputs.latest_commit }}
        run: |
          set -Eeuo pipefail
          cd dexUnifiedApi
          # submodule is checked out as detached HEAD; move to main so we can push
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          # Rewrite every ARG line to $NEW (multi-stage Dockerfile declares it
          # several times) and verify — never trust a silent no-op sed again.
          sed -i "s/^ARG BISQ_VERSION=.*/ARG BISQ_VERSION=${NEW}/" Dockerfile.bisq
          if grep -P '^ARG BISQ_VERSION=(?!'"${NEW//./\\.}"'$)' Dockerfile.bisq; then
            echo "ERROR: Dockerfile.bisq still contains a non-${NEW} ARG after sed" >&2
            exit 1
          fi
          # The image builds BISQ_COMMIT, never the floating tag: a re-cut tag
          # must not silently change a build, and changing the ARG busts the
          # stale clone layer cache.
          if ! grep -qP '^ARG BISQ_COMMIT=[0-9a-f]{40}$' Dockerfile.bisq; then
            echo "ERROR: Dockerfile.bisq has no well-formed ARG BISQ_COMMIT to bump" >&2
            exit 1
          fi
          sed -i "s/^ARG BISQ_COMMIT=.*/ARG BISQ_COMMIT=${NEW_COMMIT}/" Dockerfile.bisq
          if grep -P '^ARG BISQ_COMMIT=(?!'"${NEW_COMMIT}"'$)' Dockerfile.bisq; then
            echo "ERROR: Dockerfile.bisq still contains a non-${NEW_COMMIT} BISQ_COMMIT after sed" >&2
            exit 1
          fi
          git add Dockerfile.bisq
          if git diff --cached --quiet; then
            echo "ERROR: expected Dockerfile.bisq to change but nothing is staged (already at ${NEW}?)" >&2
            exit 1
          fi
          git commit -m "chore(bisq): bump BISQ_VERSION to ${NEW}"
          git push origin main

      - name: Open auto-merge PR for outer repo bump (submodule pointer + docker-compose.yml)
        if: steps.check.outputs.bump == 'true' && steps.check.outputs.patches_ok == 'true' && steps.dedupe.outputs.exists == 'false'
        env:
          NEW: ${{ steps.check.outputs.latest }}
          NEW_COMMIT: ${{ steps.check.outputs.latest_commit }}
          REPIN: ${{ steps.check.outputs.repin }}
          # A real PAT (not the default GITHUB_TOKEN) is required so the branch push and PR
          # actually trigger CI — GITHUB_TOKEN-created PRs do not start workflow runs.
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -Eeuo pipefail
          BRANCH="bisq-bump/${NEW}"
          # Both compose occurrences (build arg + runtime env) share this pattern.
          sed -i "s/BISQ_VERSION=[0-9]\+\.[0-9]\+\.[0-9]\+/BISQ_VERSION=${NEW}/g" docker-compose.yml
          if [ "$(grep -c "BISQ_VERSION=${NEW}" docker-compose.yml)" -lt 2 ]; then
            echo "ERROR: expected both docker-compose.yml BISQ_VERSION lines (build arg + env) to read ${NEW}" >&2
            exit 1
          fi
          git checkout -b "$BRANCH"
          git add dexUnifiedApi docker-compose.yml
          if git diff --cached --quiet; then
            echo "ERROR: expected compose/submodule changes but nothing is staged" >&2
            exit 1
          fi
          if [ "${REPIN}" = "true" ]; then
            TITLE="chore(bisq): re-pin BISQ_COMMIT for v${NEW} (upstream tag re-cut)"
            BODY="Upstream re-cut the v${NEW} tag without a version change, so only the pinned source commit moves (${NEW_COMMIT}). All bisq-patches were pre-verified to apply against ${NEW_COMMIT}; the bisq-patches-apply job and the full bisq image build re-verify on this PR."
          else
            TITLE="chore(bisq): bump BISQ_VERSION to ${NEW}"
            BODY="Automated Bisq bump to ${NEW} (pinned source ${NEW_COMMIT}). All bisq-patches were pre-verified to apply against v${NEW}; the bisq-patches-apply job and the full bisq image build re-verify on this PR."
          fi
          git commit -m "$TITLE"
          git push -u origin "$BRANCH" --force
          gh pr create \
            --base develop --head "$BRANCH" \
            --title "$TITLE" \
            --body "${BODY} Review and merge into develop once green; it then reaches prod via the usual develop -> main promotion."
          # Try auto-merge (needs GitHub Pro / 'Allow auto-merge' — unavailable on a Free
          # private repo). If it isn't available, leave the PR open for a manual merge so
          # the bump never silently fails and a human gates the version change.
          gh pr merge "$BRANCH" --auto --squash --delete-branch \
            || echo "::notice::Auto-merge unavailable; review and merge PR for bisq ${NEW} manually once CI is green."
