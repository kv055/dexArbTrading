name: Bisq version bump

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check-and-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: recursive

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Read current BISQ_VERSION
        id: current
        run: |
          current=$(grep -oP 'BISQ_VERSION=\K[0-9]+\.[0-9]+\.[0-9]+' docker-compose.yml | head -1)
          echo "version=$current" >> "$GITHUB_OUTPUT"

      - name: Fetch latest upstream release
        id: upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          auth_header=""
          [ -n "$GITHUB_TOKEN" ] && auth_header="-H \"Authorization: Bearer $GITHUB_TOKEN\""
          latest=$(curl -fsSL $auth_header \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/bisq-network/bisq/releases/latest" \
            | jq -r '.tag_name' | sed 's/^v//')
          echo "version=$latest" >> "$GITHUB_OUTPUT"

      - name: Decide whether to bump
        id: decide
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current="${{ steps.current.outputs.version }}"
          upstream="${{ steps.upstream.outputs.version }}"

          if [ "$current" = "$upstream" ]; then
            echo "bump=false" >> "$GITHUB_OUTPUT"
            echo "Up to date at ${current}"
            exit 0
          fi

          higher=$(printf '%s\n%s\n' "$current" "$upstream" | sort -V | tail -1)
          if [ "$higher" != "$upstream" ]; then
            echo "bump=false" >> "$GITHUB_OUTPUT"
            echo "Upstream ${upstream} is not newer than current ${current}; skipping"
            exit 0
          fi

          auth_header=""
          [ -n "$GITHUB_TOKEN" ] && auth_header="-H \"Authorization: Bearer $GITHUB_TOKEN\""
          assets=$(curl -fsSL $auth_header \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/bisq-network/bisq/releases/tags/v${upstream}" \
            | jq -r '[.assets[].name]')
          echo "Release assets for v${upstream}: $assets"
          if ! echo "$assets" | grep -q "bisq-daemon-${upstream}.zip" || \
             ! echo "$assets" | grep -q "bisq-cli-${upstream}.zip"; then
            echo "bump=false" >> "$GITHUB_OUTPUT"
            echo "needs_attention=true" >> "$GITHUB_OUTPUT"
            echo "assets_list=$(echo "$assets" | tr -d '\n ')" >> "$GITHUB_OUTPUT"
            echo "WARNING: bisq ${upstream} does not ship daemon/cli ZIPs — manual intervention required to upgrade" >&2
            exit 0
          fi

          echo "bump=true" >> "$GITHUB_OUTPUT"

      - name: Open issue for missing daemon ZIPs
        if: steps.decide.outputs.needs_attention == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          CURRENT: ${{ steps.current.outputs.version }}
          UPSTREAM: ${{ steps.upstream.outputs.version }}
        run: |
          existing=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues?state=open&labels=bisq-upgrade" \
            | jq -r --arg title "bisq $UPSTREAM released without daemon ZIPs" \
              '[.[] | select(.title | contains($title))] | .[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Issue #${existing} already open for ${UPSTREAM}; skipping"
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues" \
            -d "{
              \"title\": \"bisq ${UPSTREAM} released without daemon ZIPs — manual upgrade required\",
              \"body\": \"The scheduled bisq version-bump workflow detected upstream release **${UPSTREAM}** but cannot auto-upgrade: \`bisq-daemon-${UPSTREAM}.zip\` and \`bisq-cli-${UPSTREAM}.zip\` are absent from the release assets.\n\n**Current pinned version:** ${CURRENT}\n\nOnce bisq ships a release with daemon ZIPs, the workflow will auto-upgrade. Until then, trading continues on ${CURRENT}.\",
              \"labels\": [\"bisq-upgrade\"]
            }"

      - name: Bump submodule (dexUnifiedApi) and push
        if: steps.decide.outputs.bump == 'true'
        env:
          OLD: ${{ steps.current.outputs.version }}
          NEW: ${{ steps.upstream.outputs.version }}
        run: |
          cd dexUnifiedApi
          # submodule is checked out as detached HEAD; move to main so we can push
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          sed -i "s/ARG BISQ_VERSION=$OLD/ARG BISQ_VERSION=$NEW/g" Dockerfile.bisq
          git add Dockerfile.bisq
          git commit -m "chore(bisq): bump BISQ_VERSION ${OLD} -> ${NEW}"
          git push origin main

      - name: Bump outer repo (submodule pointer + docker-compose.yml) and push
        if: steps.decide.outputs.bump == 'true'
        env:
          OLD: ${{ steps.current.outputs.version }}
          NEW: ${{ steps.upstream.outputs.version }}
        run: |
          sed -i "s/BISQ_VERSION=$OLD/BISQ_VERSION=$NEW/g" docker-compose.yml
          git add dexUnifiedApi docker-compose.yml
          git commit -m "chore(bisq): bump BISQ_VERSION ${OLD} -> ${NEW}"
          git push origin main
