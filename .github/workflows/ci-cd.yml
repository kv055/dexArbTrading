# develop: test + build (validate images) + open develop→main PR
# main:    test + build (push images to GHCR) + pre-deploy + deploy to VPS
name: CI/CD

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - '.vscode/**'
      - '.codex'
      - '.agents/**'
      - 'deploy/provision/**'
      - 'dexMmController/docs/**'
      - 'dexMonitor/docs/**'
      - 'dexUnifiedApi/docs/**'
      - 'dexMmTradingLogicHummingBot/**'
      - '.gitignore'
      - '.gitmodules'
      - 'LICENSE'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - '.vscode/**'
      - '.codex'
      - '.agents/**'
      - 'deploy/provision/**'
      - 'dexMmController/docs/**'
      - 'dexMonitor/docs/**'
      - 'dexUnifiedApi/docs/**'
      - 'dexMmTradingLogicHummingBot/**'
      - '.gitignore'
      - '.gitmodules'
      - 'LICENSE'

permissions:
  contents: read
  packages: write

# Per-branch serialization: keeps the single-VPS deploy (main) from overlapping
# itself, while a long develop/staging validation never queues ahead of a prod deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  security:
    name: Secret protection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Validate encrypted environment contract
        run: bash scripts/validate-env-contract.sh keys

      - name: Install Gitleaks
        run: |
          set -Eeuo pipefail
          install_dir=$(mktemp -d)
          trap 'rm -rf "$install_dir"' EXIT
          archive="$install_dir/gitleaks.tar.gz"
          bin_dir="${RUNNER_TEMP:-$HOME/.local}/gitleaks-${GITLEAKS_VERSION}"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$archive"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum -c -
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$install_dir" gitleaks
          install "$install_dir/gitleaks" "$bin_dir/gitleaks"
          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"

      - name: Reject plaintext dotenv files
        run: |
          set -Eeuo pipefail
          offending=()
          while IFS= read -r -d '' path; do
            basename=${path##*/}
            case "$basename" in
              .env|.env.*)
                case "$basename" in
                  *.enc|*.example) ;;
                  *) offending+=("$path") ;;
                esac
                ;;
            esac
          done < <(find . -type d -name .git -prune -o -type f \( -name '.env' -o -name '.env.*' \) -print0)
          if ((${#offending[@]})); then
            printf 'ERROR: plaintext dotenv files are forbidden in the checkout:\n' >&2
            printf '  %s\n' "${offending[@]}" >&2
            exit 1
          fi

      - name: Scan root and submodule snapshot
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner

  database-sql-integrity:
    name: Database SQL immutability
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Reject changed database SQL history
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "Manual run has no change range; skipping database SQL immutability check."
            exit 0
          fi
          if [ "$EVENT" = pull_request ]; then base="$PR_BASE"; head="$PR_HEAD"; else base="$BEFORE"; head="$AFTER"; fi
          if [ -z "$base" ] || [ "$base" = "$zero" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base=$(git rev-parse "${head}^" 2>/dev/null || true)
          fi
          [ -n "$base" ] || { echo "No usable base commit; refusing to skip database SQL immutability check." >&2; exit 1; }
          old=$(git ls-tree "$base" dexUnifiedApi | awk '{print $3}')
          new=$(git ls-tree "$head" dexUnifiedApi | awk '{print $3}')
          [ -n "$old" ] && [ -n "$new" ] || { echo "Unable to resolve dexUnifiedApi submodule revisions." >&2; exit 1; }
          [ "$old" != "$new" ] || { echo "dexUnifiedApi submodule is unchanged."; exit 0; }
          git -C dexUnifiedApi fetch --no-tags origin "$old" "$new"

          violations=()
          while IFS=$'\t' read -r status first second; do
            [ -n "$status" ] || continue
            if [ "${status:0:1}" = A ] && [[ "$first" == db/migrations/*.sql ]] \
              && [[ "${first##*/}" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]]; then
              echo "allowed new migration: $first"
              continue
            fi
            violations+=("$status $first${second:+ -> $second}")
          done < <(git -C dexUnifiedApi diff --name-status --find-renames "$old" "$new" -- db/schema db/migrations)

          if ((${#violations[@]})); then
            printf 'ERROR: existing database SQL is immutable. Add only new timestamped migrations under db/migrations/.\n' >&2
            printf '  %s\n' "${violations[@]}" >&2
            exit 1
          fi

  detect-changes:
    # Diff the push/PR range and decide which tests and image builds run.
    name: Detect changed services
    needs: security
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.detect.outputs.changes }}
      test_modules: ${{ steps.detect.outputs.test_modules }}
      test_modules_json: ${{ steps.detect.outputs.test_modules_json }}
      run_frontend: ${{ steps.detect.outputs.run_frontend }}
      build_matrix_json: ${{ steps.detect.outputs.build_matrix_json }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so both ends of the compared range are present (a push can
          # carry several commits; a PR's base/head are parents of the merge commit).
          fetch-depth: 0
      - name: Determine changed services
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          ALL_SERVICES="tor,bisq,bisq2,unified-api,unified-snapshot,postgres-backup,dexmonitor,mm-controller,fiat-controller"
          ALL_MODULES="commons,dexUnifiedApi,dexMmController,dexMonitor,dexFiatController"
          ZERO="0000000000000000000000000000000000000000"

          add_csv() {
            local list="$1" item="$2"
            case ",$list," in *",$item,"*) echo "$list" ;; *) echo "${list:+$list,}$item" ;; esac
          }

          comma_to_json_array() {
            local csv="${1:-}"
            if [ -z "$csv" ]; then echo '[]'; return; fi
            local IFS=',' parts=() p json='[' first=true
            read -ra parts <<< "$csv"
            for p in "${parts[@]}"; do
              [ -n "$p" ] || continue
              $first || json+=','
              first=false
              json+="\"$p\""
            done
            json+=']'
            echo "$json"
          }

          build_matrix_json_for() {
            local csv="${1:-}"
            [ -n "$csv" ] || { echo '[]'; return; }
            jq -n --arg csv "$csv" '
              ($csv | split(",") | map(select(length > 0))) as $want |
              [
                {service:"tor",             context:"./dexUnifiedApi", dockerfile:"dexUnifiedApi/Dockerfile.tor"},
                {service:"bisq",            context:"./dexUnifiedApi", dockerfile:"dexUnifiedApi/Dockerfile.bisq"},
                {service:"bisq2",           context:"./dexUnifiedApi", dockerfile:"dexUnifiedApi/Dockerfile.bisq2"},
                {service:"unified-api",     context:".", dockerfile:"dexUnifiedApi/Dockerfile"},
                {service:"unified-snapshot",context:".", dockerfile:"dexUnifiedApi/Dockerfile.snapshot"},
                {service:"postgres-backup", context:".", dockerfile:"dexUnifiedApi/Dockerfile.backup"},
                {service:"dexmonitor",      context:".", dockerfile:"dexMonitor/Dockerfile"},
                {service:"mm-controller",   context:".", dockerfile:"dexMmController/Dockerfile"},
                # totp-api disabled (see docker-compose.yml / services/totp-api/Dockerfile)
                {service:"fiat-controller",context:".", dockerfile:"dexFiatController/Dockerfile"}
              ] | map(select(.service as $s | $want | index($s)))
            '
          }

          write_outputs() {
            local changes="$1" test_modules="$2" run_frontend="$3"
            local test_modules_json build_matrix_json
            test_modules_json=$(comma_to_json_array "$test_modules")
            build_matrix_json=$(build_matrix_json_for "$changes")
            echo "changes=${changes:-}" >> "$GITHUB_OUTPUT"
            echo "test_modules=${test_modules:-}" >> "$GITHUB_OUTPUT"
            echo "run_frontend=${run_frontend}" >> "$GITHUB_OUTPUT"
            {
              echo 'test_modules_json<<EOF'
              echo "$test_modules_json"
              echo 'EOF'
              echo 'build_matrix_json<<EOF'
              echo "$build_matrix_json"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
            echo "services to build: ${changes:-<none>}"
            echo "test modules: ${test_modules:-<none>}"
            echo "run frontend: ${run_frontend}"
            echo "build matrix: ${build_matrix_json}"
          }

          emit_all() {
            echo "${1:-build all}"
            write_outputs "$ALL_SERVICES" "$ALL_MODULES" "true"
          }

          resolve_base() {
            local before="${1:-}" after="${2:-}"
            echo "resolve_base: event=${EVENT:-} before=${before:-<empty>} after=${after:-<empty>}" >&2
            if [ -n "$before" ] && [ "$before" != "$ZERO" ] && git cat-file -e "${before}^{commit}" 2>/dev/null; then
              echo "$before"; return 0
            fi
            if git cat-file -e "${after}^{commit}" 2>/dev/null && parent=$(git rev-parse "${after}^" 2>/dev/null); then
              echo "before unusable (${before:-<empty>}); falling back to parent ${parent}" >&2
              echo "$parent"; return 0
            fi
            echo ""
          }

          map_paths() {
            local changed="$1" S="" M="" run_frontend=false
            path_changed() { printf '%s\n' "$changed" | grep -qE "$1"; }
            if path_changed '^commons(/|$)'; then
              S=$(add_csv "$S" unified-api); S=$(add_csv "$S" unified-snapshot)
              S=$(add_csv "$S" postgres-backup); S=$(add_csv "$S" dexmonitor)
              M=$(add_csv "$M" commons); M=$(add_csv "$M" dexUnifiedApi); M=$(add_csv "$M" dexMonitor)
              run_frontend=true
            fi
            if path_changed '^dexUnifiedApi(/|$)'; then
              S=$(add_csv "$S" tor); S=$(add_csv "$S" bisq); S=$(add_csv "$S" bisq2)
              S=$(add_csv "$S" unified-api); S=$(add_csv "$S" unified-snapshot); S=$(add_csv "$S" postgres-backup)
              M=$(add_csv "$M" dexUnifiedApi); run_frontend=true
            fi
            if path_changed '^dexMonitor(/|$)'; then
              S=$(add_csv "$S" dexmonitor); M=$(add_csv "$M" dexMonitor); run_frontend=true
            fi
            if path_changed '^dexMmController(/|$)'; then
              S=$(add_csv "$S" mm-controller); M=$(add_csv "$M" dexMmController); run_frontend=true
            fi
            if path_changed '^dexFiatController(/|$)'; then
              S=$(add_csv "$S" fiat-controller); M=$(add_csv "$M" dexFiatController); run_frontend=true
            fi
            if $run_frontend; then write_outputs "$S" "$M" "true"; else write_outputs "$S" "$M" "false"; fi
          }

          if [ "${EVENT:-}" = "workflow_dispatch" ]; then emit_all "manual trigger -> build all"; exit 0; fi

          if [ "${EVENT:-}" = "pull_request" ]; then BASE="${PR_BASE:-}"; HEAD="${PR_HEAD:-}"
          else BASE="${BEFORE:-}"; HEAD="${AFTER:-}"; fi

          BASE=$(resolve_base "$BASE" "$HEAD")
          if [ -z "$BASE" ]; then emit_all "no usable base commit -> build all"; exit 0; fi

          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          echo "diff range: ${BASE}..${HEAD}"
          echo "changed paths:"
          printf '%s\n' "$CHANGED"

          changed() { printf '%s\n' "$CHANGED" | grep -qE "$1"; }
          if changed '^(\.gitmodules|go\.work|go\.work\.sum)$'; then
            emit_all "infra change -> build all"; exit 0
          fi

          map_paths "$CHANGED"

  test-go:
    name: Go tests (${{ matrix.module }})
    needs: detect-changes
    if: needs.detect-changes.outputs.test_modules != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect-changes.outputs.test_modules_json) }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: go test ./...

  bisq-patches-apply:
    # Fast guard (seconds, not the full image build): prove the bisq source
    # patches still apply against the pinned BISQ_VERSION. A version bump that
    # refactors the patched files fails here immediately instead of deep inside
    # the slow from-source image build.
    name: Bisq patches apply cleanly
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.changes, 'bisq')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Clone pinned bisq and apply patches
        run: |
          set -Eeuo pipefail
          version=$(grep -m1 -oP '^ARG BISQ_VERSION=\K[0-9]+\.[0-9]+\.[0-9]+' dexUnifiedApi/Dockerfile.bisq)
          echo "Checking patches against bisq v${version}"
          git clone --depth 1 --branch "v${version}" https://github.com/bisq-network/bisq.git /tmp/bisq
          cd /tmp/bisq
          for p in "$GITHUB_WORKSPACE"/dexUnifiedApi/bisq-patches/*.patch; do
            echo "applying $(basename "$p")"
            git apply --3way "$p"
          done
          echo "All patches apply cleanly against v${version}."

  compose-validate:
    name: Compose topology validation
    needs: detect-changes
    # Cheap (docker compose config + grep) and secret-free: the script
    # materializes empty .env placeholders for any missing env_file, so it
    # works on a fresh checkout. Run on every PR to catch network-mode and
    # service-wiring regressions even when no application image needs building.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate compose topology
        run: bash scripts/compose-validate.sh

  test-frontend:
    name: Frontend tests
    needs: detect-changes
    if: needs.detect-changes.outputs.run_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dexMonitor/react-frontend
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dexMonitor/react-frontend/package-lock.json

      - run: npm ci

      - name: Verify OpenAPI route catalogs
        working-directory: .
        run: python3 scripts/openapi-route-catalogs.py --check

      - name: Verify generated API contracts
        run: npm run check:api-contract

      - name: Lint
        run: npm run lint

      - name: Build (tsc + vite)
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('dexMonitor/react-frontend/package-lock.json') }}

      - name: Install Playwright browsers + deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        # The browser download intermittently stalls with no internal timeout, which
        # hung this job for hours before. Bound each attempt and retry; re-running the
        # apt portion is cheap since the system deps are already installed.
        run: |
          for i in 1 2 3; do
            timeout 300 npx playwright install --with-deps chromium && exit 0
            echo "::warning::playwright install attempt $i stalled/failed; retrying"
          done
          exit 1

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: dexMonitor/react-frontend/playwright-report/
          retention-days: 7

  certificate-renewal-test:
    name: Certificate renewal regression tests
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash deploy/test-letsencrypt.sh

  test-gate:
    name: Test gate
    needs: [database-sql-integrity, detect-changes, test-go, test-frontend, certificate-renewal-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful or intentionally skipped tests
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          DATABASE_SQL_RESULT: ${{ needs.database-sql-integrity.result }}
          GO_RESULT: ${{ needs.test-go.result }}
          FRONTEND_RESULT: ${{ needs.test-frontend.result }}
          CERTIFICATE_RESULT: ${{ needs.certificate-renewal-test.result }}
        run: |
          set -Eeuo pipefail
          [ "$DATABASE_SQL_RESULT" = success ]
          [ "$DETECT_RESULT" = success ]
          case "$GO_RESULT" in success|skipped) ;; *) exit 1;; esac
          case "$FRONTEND_RESULT" in success|skipped) ;; *) exit 1;; esac
          [ "$CERTIFICATE_RESULT" = success ]

  build-and-push:
    name: Build & push ${{ matrix.service }}
    needs: [detect-changes, test-gate]
    if: |
      needs.detect-changes.result == 'success' &&
      needs.test-gate.result == 'success' &&
      needs.detect-changes.outputs.changes != ''
    # Runs on both push (build + push) and pull_request (build-only validation, see the
    # 'push:' flag below) so a bad image — e.g. an auto bisq bump — is caught before merge.
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILD_SUMMARY: false
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.build_matrix_json) }}
    steps:
      - name: Compute lowercase image owner
        id: owner
        run: |
          echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Compute build metadata
        id: meta
        run: |
          echo "commit_hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "commit_date=$(git log -1 --format=%cI)"   >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # Frontend "deployed commit" header values; only the dexmonitor image
          # consumes them, the rest emit a harmless "unused build args" buildx warning.
          build-args: |
            COMMIT_HASH=${{ steps.meta.outputs.commit_hash }}
            COMMIT_DATE=${{ steps.meta.outputs.commit_date }}
          # Push only on merges to main; PRs build for validation but never publish/deploy.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/dexarbtrading-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/dexarbtrading-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  build-report:
    name: Build report
    needs: build-and-push
    if: always() && needs.build-and-push.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Write consolidated summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Docker Build Summary"
            echo ""
            echo "| Service | Status | Duration |"
            echo "|---------|:------:|:--------:|"
            gh api "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
              --paginate --jq '
                .jobs[]
                | select(.name | startswith("Build & push "))
                | {
                    svc:        (.name | ltrimstr("Build & push ")),
                    conclusion: .conclusion,
                    duration: (
                      if .started_at and .completed_at then
                        ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) | "\(.)s"
                      else "—" end
                    )
                  }
                | "| \(.svc) | \(if .conclusion == "success" then "✅ success" elif .conclusion == "failure" then "❌ failure" elif .conclusion == null then "🔄 running" else "⚠️ \(.conclusion)" end) | \(.duration) |"
              '
            echo ""
            echo "_Run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_"
          } >> "$GITHUB_STEP_SUMMARY"

  open-promote-pr:
    name: Open develop → main PR
    needs: [detect-changes, test-gate, build-and-push]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      needs.test-gate.result == 'success' &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create or reuse promote PR
        env:
          # GITHUB_TOKEN cannot create PRs unless the repo setting
          # "Allow GitHub Actions to create and approve pull requests" is on;
          # GH_PAT is the same pattern as bisq-version-bump.
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          existing=$(gh pr list --repo "$REPO" --base main --head develop --state open --json url --jq '.[0].url // empty')
          if [ -n "$existing" ]; then
            echo "Open promote PR already exists: ${existing}"
            exit 0
          fi

          body=$(printf 'Develop CI is green for `%s`. Merge this PR into `main` to promote.\n\nActions run: %s' "$SHA" "$RUN_URL")
          url=$(gh pr create \
            --repo "$REPO" \
            --base main \
            --head develop \
            --title "Promote develop → main" \
            --body "$body")
          echo "Opened promote PR: ${url}"

  pre-deploy:
    name: Pre-deploy checks
    needs: [detect-changes, test-gate, build-and-push]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.test-gate.result == 'success' &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compute lowercase image owner
        id: owner
        run: |
          echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify changed image SHA tags exist in GHCR
        env:
          CHANGED_SERVICES: ${{ needs.detect-changes.outputs.changes }}
          OWNER: ${{ steps.owner.outputs.value }}
          SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          for svc in ${CHANGED_SERVICES//,/ }; do
            tag="${REGISTRY}/${OWNER}/dexarbtrading-${svc}:${SHA}"
            echo "checking $tag"
            docker manifest inspect "$tag" >/dev/null
          done

      - name: Install SSH key & known_hosts
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%b\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%b\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Egress reachability check (VPS)
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" "bash -s" <<'REMOTE'
          set -Eeuo pipefail

          check_ws() {
            local url="$1"
            local key
            key=$(openssl rand -base64 16)
            local out curl_exit=0
            out=$(curl -sS --http1.1 --include --max-time 10 \
                -H "Connection: Upgrade" \
                -H "Upgrade: websocket" \
                -H "Sec-WebSocket-Key: $key" \
                -H "Sec-WebSocket-Version: 13" \
                "$url" 2>&1) || curl_exit=$?
            # 28 = CURLE_OPERATION_TIMEDOUT — expected after a successful WS handshake
            if [ "$curl_exit" -ne 0 ] && [ "$curl_exit" -ne 28 ]; then
              echo "WSS unreachable: $url"
              printf '%s\n' "$out" | head -5
              return 1
            fi
            if ! printf '%s\n' "$out" | grep -q ' 101 '; then
              echo "WSS no 101 upgrade: $url"
              printf '%s\n' "$out" | head -5
              return 1
            fi
            echo "ok wss $url"
          }

          check_https() {
            local url="$1"
            if ! curl -fsS --max-time 10 "$url" >/dev/null; then
              echo "HTTPS unreachable: $url"
              return 1
            fi
            echo "ok https $url"
          }

          check_ws    "https://ws.kraken.com/v2"
          check_ws    "https://ws.bitstamp.net/"
          check_ws    "https://advanced-trade-ws.coinbase.com/"
          check_https "https://api.kraken.com/0/public/SystemStatus"

          echo "egress reachability ok"
          REMOTE

      - name: VPS health checks
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          REPO_DIR: ${{ secrets.VPS_REPO_DIR }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" "REPO_DIR='$REPO_DIR' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          docker info >/dev/null
          docker compose version >/dev/null
          test -d "$REPO_DIR" || { echo "missing repo dir $REPO_DIR on VPS"; exit 1; }
          echo "Docker disk usage before unused-image prune:"
          docker system df
          docker image prune -af
          echo "Docker disk usage after unused-image prune:"
          docker system df
          docker_root=$(docker info --format '{{.DockerRootDir}}' 2>/dev/null || echo /var/lib/docker)
          free_kb=$(df -P "$docker_root" | awk 'NR==2 {print $4}')
          [ "$free_kb" -gt 5242880 ] || { echo "low disk on $docker_root: $((free_kb/1024)) MB free, need >= 5120"; exit 1; }
          echo "health checks ok"
          REMOTE

  deploy:
    name: Deploy
    needs: [detect-changes, pre-deploy]
    runs-on: ubuntu-latest
    # Leave enough time for a 30-minute cold-start health wait and rollback.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Install SSH key & known_hosts
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%b\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%b\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Validate and stage encrypted environment bundle
        timeout-minutes: 3
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          REPO_DIR: ${{ secrets.VPS_REPO_DIR }}
          NEW_SHA: ${{ github.sha }}
          KEY_ROOT:            ${{ secrets.DOTENV_PRIVATE_KEY_ROOT }}
          KEY_UNIFIED_API:     ${{ secrets.DOTENV_PRIVATE_KEY_UNIFIED_API }}
          KEY_MONITOR:         ${{ secrets.DOTENV_PRIVATE_KEY_MONITOR }}
          KEY_MM_CONTROLLER:   ${{ secrets.DOTENV_PRIVATE_KEY_MM_CONTROLLER }}
          KEY_FIAT_CONTROLLER: ${{ secrets.DOTENV_PRIVATE_KEY_FIAT_CONTROLLER }}
        run: |
          set -Eeuo pipefail
          curl -sfS https://dotenvx.sh | sh
          bash deploy/ci-stage-env.sh "$NEW_SHA"

      - name: Activate staged release transactionally
        timeout-minutes: 65
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          REPO_DIR: ${{ secrets.VPS_REPO_DIR }}
          GHCR_TOKEN: ${{ secrets.GH_PAT }}
          GHCR_USER: ${{ github.actor }}
          NEW_SHA: ${{ github.sha }}
          CHANGED_SERVICES: ${{ needs.detect-changes.outputs.changes }}
          FETCH_ORIGIN: "true"
        # Detached VPS activate + result polling so a hung SSH pipe cannot
        # false-fail CI after a successful transactional deploy.
        run: bash deploy/ci-activate.sh

      - name: Remove staged plaintext environment
        if: always()
        continue-on-error: true
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          REPO_DIR: ${{ secrets.VPS_REPO_DIR }}
          NEW_SHA: ${{ github.sha }}
        run: bash deploy/ci-cleanup-staging.sh
