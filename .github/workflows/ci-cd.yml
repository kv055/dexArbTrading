name: CI/CD

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - '.vscode/**'
      - '.codex'
      - '.agents/**'
      - 'deploy/provision/**'
      - 'dexMmController/docs/**'
      - 'dexMonitor/docs/**'
      - 'dexUnifiedApi/docs/**'
      - 'dexMmTradingLogicHummingBot/**'
      - '.gitignore'
      - '.gitmodules'
      - 'LICENSE'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - '.vscode/**'
      - '.codex'
      - '.agents/**'
      - 'deploy/provision/**'
      - 'dexMmController/docs/**'
      - 'dexMonitor/docs/**'
      - 'dexUnifiedApi/docs/**'
      - 'dexMmTradingLogicHummingBot/**'
      - '.gitignore'
      - '.gitmodules'
      - 'LICENSE'

permissions:
  contents: read
  packages: write

# Per-branch serialization: keeps the single-VPS deploy (main) from overlapping
# itself, while a long develop/staging validation never queues ahead of a prod deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  security:
    name: Secret protection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Install Gitleaks
        run: |
          set -Eeuo pipefail
          install_dir=$(mktemp -d)
          trap 'rm -rf "$install_dir"' EXIT
          archive="$install_dir/gitleaks.tar.gz"
          bin_dir="${RUNNER_TEMP:-$HOME/.local}/gitleaks-${GITLEAKS_VERSION}"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$archive"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum -c -
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$install_dir" gitleaks
          install "$install_dir/gitleaks" "$bin_dir/gitleaks"
          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"

      - name: Reject plaintext dotenv files
        run: |
          set -Eeuo pipefail
          offending=()
          while IFS= read -r -d '' path; do
            basename=${path##*/}
            case "$basename" in
              .env|.env.*)
                case "$basename" in
                  *.enc|*.example) ;;
                  *) offending+=("$path") ;;
                esac
                ;;
            esac
          done < <(find . -type d -name .git -prune -o -type f \( -name '.env' -o -name '.env.*' \) -print0)
          if ((${#offending[@]})); then
            printf 'ERROR: plaintext dotenv files are forbidden in the checkout:\n' >&2
            printf '  %s\n' "${offending[@]}" >&2
            exit 1
          fi

      - name: Scan root and submodule snapshot
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner

  detect-changes:
    # Diff the push/PR range and decide which tests, image builds, and GHCR re-tags run.
    name: Detect changed services
    needs: security
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.detect.outputs.changes }}
      test_modules: ${{ steps.detect.outputs.test_modules }}
      test_modules_json: ${{ steps.detect.outputs.test_modules_json }}
      run_frontend: ${{ steps.detect.outputs.run_frontend }}
      build_matrix_json: ${{ steps.detect.outputs.build_matrix_json }}
      retag_services_json: ${{ steps.detect.outputs.retag_services_json }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so both ends of the compared range are present (a push can
          # carry several commits; a PR's base/head are parents of the merge commit).
          fetch-depth: 0
      - name: Determine changed services
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          ALL_SERVICES="tor,bisq,bisq2,unified-api,unified-snapshot,postgres-backup,dexmonitor,mm-controller,totp-api,fiat-controller"
          ALL_MODULES="commons,dexUnifiedApi,dexMmController,dexMonitor,dexFiatController"
          ZERO="0000000000000000000000000000000000000000"

          add_csv() {
            local list="$1" item="$2"
            case ",$list," in *",$item,"*) echo "$list" ;; *) echo "${list:+$list,}$item" ;; esac
          }

          comma_to_json_array() {
            local csv="${1:-}"
            if [ -z "$csv" ]; then echo '[]'; return; fi
            local IFS=',' parts=() p json='[' first=true
            read -ra parts <<< "$csv"
            for p in "${parts[@]}"; do
              [ -n "$p" ] || continue
              $first || json+=','
              first=false
              json+="\"$p\""
            done
            json+=']'
            echo "$json"
          }

          build_matrix_json_for() {
            local csv="${1:-}"
            [ -n "$csv" ] || { echo '[]'; return; }
            jq -n --arg csv "$csv" '
              ($csv | split(",") | map(select(length > 0))) as $want |
              [
                {service:"tor",             context:"./dexUnifiedApi", dockerfile:"dexUnifiedApi/Dockerfile.tor"},
                {service:"bisq",            context:"./dexUnifiedApi", dockerfile:"dexUnifiedApi/Dockerfile.bisq"},
                {service:"bisq2",           context:"./dexUnifiedApi", dockerfile:"dexUnifiedApi/Dockerfile.bisq2"},
                {service:"unified-api",     context:".", dockerfile:"dexUnifiedApi/Dockerfile"},
                {service:"unified-snapshot",context:".", dockerfile:"dexUnifiedApi/Dockerfile.snapshot"},
                {service:"postgres-backup", context:".", dockerfile:"dexUnifiedApi/Dockerfile.backup"},
                {service:"dexmonitor",      context:".", dockerfile:"dexMonitor/Dockerfile"},
                {service:"mm-controller",   context:".", dockerfile:"dexMmController/Dockerfile"},
                {service:"totp-api",        context:"./dexFiatController/services/totp-api", dockerfile:"dexFiatController/services/totp-api/Dockerfile"},
                {service:"fiat-controller",context:".", dockerfile:"dexFiatController/Dockerfile"}
              ] | map(select(.service as $s | $want | index($s)))
            '
          }

          retag_services_json_for() {
            local changes_csv="${1:-}"
            jq -n --arg all "$ALL_SERVICES" --arg changed "${changes_csv:-}" '
              ($all | split(",")) as $all |
              ($changed | split(",") | map(select(length > 0))) as $changed |
              [$all[] | select(. as $s | ($changed | index($s) | not))]
            '
          }

          write_outputs() {
            local changes="$1" test_modules="$2" run_frontend="$3"
            local test_modules_json build_matrix_json retag_services_json
            test_modules_json=$(comma_to_json_array "$test_modules")
            build_matrix_json=$(build_matrix_json_for "$changes")
            retag_services_json=$(retag_services_json_for "$changes")
            echo "changes=${changes:-}" >> "$GITHUB_OUTPUT"
            echo "test_modules=${test_modules:-}" >> "$GITHUB_OUTPUT"
            echo "run_frontend=${run_frontend}" >> "$GITHUB_OUTPUT"
            {
              echo 'test_modules_json<<EOF'
              echo "$test_modules_json"
              echo 'EOF'
              echo 'build_matrix_json<<EOF'
              echo "$build_matrix_json"
              echo 'EOF'
              echo 'retag_services_json<<EOF'
              echo "$retag_services_json"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
            echo "services to build: ${changes:-<none>}"
            echo "test modules: ${test_modules:-<none>}"
            echo "run frontend: ${run_frontend}"
            echo "build matrix: ${build_matrix_json}"
            echo "retag services: ${retag_services_json}"
          }

          emit_all() {
            echo "${1:-build all}"
            write_outputs "$ALL_SERVICES" "$ALL_MODULES" "true"
          }

          resolve_base() {
            local before="${1:-}" after="${2:-}"
            echo "resolve_base: event=${EVENT:-} before=${before:-<empty>} after=${after:-<empty>}" >&2
            if [ -n "$before" ] && [ "$before" != "$ZERO" ] && git cat-file -e "${before}^{commit}" 2>/dev/null; then
              echo "$before"; return 0
            fi
            if git cat-file -e "${after}^{commit}" 2>/dev/null && parent=$(git rev-parse "${after}^" 2>/dev/null); then
              echo "before unusable (${before:-<empty>}); falling back to parent ${parent}" >&2
              echo "$parent"; return 0
            fi
            echo ""
          }

          map_paths() {
            local changed="$1" S="" M="" run_frontend=false
            path_changed() { printf '%s\n' "$changed" | grep -qE "$1"; }
            if path_changed '^commons(/|$)'; then
              S=$(add_csv "$S" unified-api); S=$(add_csv "$S" unified-snapshot)
              S=$(add_csv "$S" postgres-backup); S=$(add_csv "$S" dexmonitor)
              M=$(add_csv "$M" commons); M=$(add_csv "$M" dexUnifiedApi); M=$(add_csv "$M" dexMonitor)
              run_frontend=true
            fi
            if path_changed '^dexUnifiedApi(/|$)'; then
              S=$(add_csv "$S" tor); S=$(add_csv "$S" bisq); S=$(add_csv "$S" bisq2)
              S=$(add_csv "$S" unified-api); S=$(add_csv "$S" unified-snapshot); S=$(add_csv "$S" postgres-backup)
              M=$(add_csv "$M" dexUnifiedApi)
            fi
            if path_changed '^dexMonitor(/|$)'; then
              S=$(add_csv "$S" dexmonitor); M=$(add_csv "$M" dexMonitor); run_frontend=true
            fi
            if path_changed '^dexMmController(/|$)'; then
              S=$(add_csv "$S" mm-controller); M=$(add_csv "$M" dexMmController)
            fi
            if path_changed '^dexFiatController(/|$)'; then
              S=$(add_csv "$S" fiat-controller); S=$(add_csv "$S" totp-api); M=$(add_csv "$M" dexFiatController)
            fi
            if $run_frontend; then write_outputs "$S" "$M" "true"; else write_outputs "$S" "$M" "false"; fi
          }

          if [ "${EVENT:-}" = "workflow_dispatch" ]; then emit_all "manual trigger -> build all"; exit 0; fi

          if [ "${EVENT:-}" = "pull_request" ]; then BASE="${PR_BASE:-}"; HEAD="${PR_HEAD:-}"
          else BASE="${BEFORE:-}"; HEAD="${AFTER:-}"; fi

          BASE=$(resolve_base "$BASE" "$HEAD")
          if [ -z "$BASE" ]; then emit_all "no usable base commit -> build all"; exit 0; fi

          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          echo "diff range: ${BASE}..${HEAD}"
          echo "changed paths:"
          printf '%s\n' "$CHANGED"

          changed() { printf '%s\n' "$CHANGED" | grep -qE "$1"; }
          if changed '^(docker-compose\.yml|\.gitmodules|go\.work|go\.work\.sum)$'; then
            emit_all "infra change -> build all"; exit 0
          fi

          map_paths "$CHANGED"

  test-go:
    name: Go tests (${{ matrix.module }})
    needs: detect-changes
    if: needs.detect-changes.outputs.test_modules != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect-changes.outputs.test_modules_json) }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: go test ./...

  bisq-patches-apply:
    # Fast guard (seconds, not the full image build): prove the bisq source
    # patches still apply against the pinned BISQ_VERSION. A version bump that
    # refactors the patched files fails here immediately instead of deep inside
    # the slow from-source image build.
    name: Bisq patches apply cleanly
    needs: detect-changes
    if: contains(needs.detect-changes.outputs.changes, 'bisq')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Clone pinned bisq and apply patches
        run: |
          set -Eeuo pipefail
          version=$(grep -m1 -oP '^ARG BISQ_VERSION=\K[0-9]+\.[0-9]+\.[0-9]+' dexUnifiedApi/Dockerfile.bisq)
          echo "Checking patches against bisq v${version}"
          git clone --depth 1 --branch "v${version}" https://github.com/bisq-network/bisq.git /tmp/bisq
          cd /tmp/bisq
          for p in "$GITHUB_WORKSPACE"/dexUnifiedApi/bisq-patches/*.patch; do
            echo "applying $(basename "$p")"
            git apply --3way "$p"
          done
          echo "All patches apply cleanly against v${version}."

  compose-validate:
    name: Compose topology validation
    needs: detect-changes
    # Cheap (docker compose config + grep) and secret-free: the script
    # materializes empty .env placeholders for any missing env_file, so it
    # works on a fresh checkout. Run on every PR to catch network-mode /
    # service-wiring regressions even when only docker-compose.yml changed
    # (detect-changes treats such edits as "build all" and sets no dedicated
    # output, so gate on the PR having any testable change rather than a
    # compose-specific flag).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate compose topology
        run: bash scripts/compose-validate.sh

  test-frontend:
    name: Frontend tests
    needs: detect-changes
    if: needs.detect-changes.outputs.run_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dexMonitor/react-frontend
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dexMonitor/react-frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (tsc + vite)
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('dexMonitor/react-frontend/package-lock.json') }}

      - name: Install Playwright browsers + deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        # The browser download intermittently stalls with no internal timeout, which
        # hung this job for hours before. Bound each attempt and retry; re-running the
        # apt portion is cheap since the system deps are already installed.
        run: |
          for i in 1 2 3; do
            timeout 300 npx playwright install --with-deps chromium && exit 0
            echo "::warning::playwright install attempt $i stalled/failed; retrying"
          done
          exit 1

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: dexMonitor/react-frontend/playwright-report/
          retention-days: 7

  build-and-push:
    name: Build & push ${{ matrix.service }}
    needs: [detect-changes, test-go, test-frontend]
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.changes != ''
    # Runs on both push (build + push) and pull_request (build-only validation, see the
    # 'push:' flag below) so a bad image — e.g. an auto bisq bump — is caught before merge.
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILD_SUMMARY: false
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.build_matrix_json) }}
    steps:
      - name: Compute lowercase image owner
        id: owner
        run: |
          echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Compute build metadata
        id: meta
        run: |
          echo "commit_hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "commit_date=$(git log -1 --format=%cI)"   >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # Frontend "deployed commit" header values; only the dexmonitor image
          # consumes them, the rest emit a harmless "unused build args" buildx warning.
          build-args: |
            COMMIT_HASH=${{ steps.meta.outputs.commit_hash }}
            COMMIT_DATE=${{ steps.meta.outputs.commit_date }}
          # Push only on merges to main; PRs build for validation but never publish/deploy.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/dexarbtrading-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/dexarbtrading-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  retag-images:
    name: Re-tag ${{ matrix.service }}
    needs: [detect-changes, test-go, test-frontend]
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.detect-changes.outputs.retag_services_json != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.retag_services_json) }}
    steps:
      - name: Compute lowercase image owner
        id: owner
        run: |
          echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Unchanged services still need a SHA-tagged image so pre-deploy's manifest check
      # and deploy's `compose pull` succeed. Copy :latest -> :<sha> in GHCR.
      - name: Re-tag latest as SHA (unchanged service)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ steps.owner.outputs.value }}
          SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          echo "$TOKEN" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          IMG="${REGISTRY}/${OWNER}/dexarbtrading-${{ matrix.service }}"
          if ! docker buildx imagetools inspect "$IMG:latest" >/dev/null 2>&1; then
            echo "::error::no $IMG:latest to re-tag — re-run after a full build (e.g. touch an infra file) to seed it"
            exit 1
          fi
          docker buildx imagetools create --tag "$IMG:$SHA" "$IMG:latest"
          echo "re-tagged $IMG:latest -> :$SHA"

  build-report:
    name: Build report
    needs: [build-and-push, retag-images]
    if: always() && (needs.build-and-push.result != 'skipped' || needs.retag-images.result != 'skipped')
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Write consolidated summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Docker Build Summary"
            echo ""
            echo "| Service | Status | Duration |"
            echo "|---------|:------:|:--------:|"
            gh api "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
              --paginate --jq '
                .jobs[]
                | select(.name | startswith("Build & push ") or startswith("Re-tag "))
                | {
                    svc:        (.name | if startswith("Build & push ") then ltrimstr("Build & push ") else ltrimstr("Re-tag ") end),
                    conclusion: .conclusion,
                    duration: (
                      if .started_at and .completed_at then
                        ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) | "\(.)s"
                      else "—" end
                    )
                  }
                | "| \(.svc) | \(if .conclusion == "success" then "✅ success" elif .conclusion == "failure" then "❌ failure" elif .conclusion == null then "🔄 running" else "⚠️ \(.conclusion)" end) | \(.duration) |"
              '
            echo ""
            echo "_Run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_"
          } >> "$GITHUB_STEP_SUMMARY"

  pre-deploy:
    name: Pre-deploy checks
    needs: [build-and-push, retag-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVICES: tor bisq bisq2 unified-api unified-snapshot postgres-backup dexmonitor mm-controller totp-api fiat-controller
    steps:
      - name: Compute lowercase image owner
        id: owner
        run: |
          echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify all image SHA tags exist in GHCR
        env:
          OWNER: ${{ steps.owner.outputs.value }}
          SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          for svc in $SERVICES; do
            tag="${REGISTRY}/${OWNER}/dexarbtrading-${svc}:${SHA}"
            echo "checking $tag"
            docker manifest inspect "$tag" >/dev/null
          done

      - name: Install SSH key & known_hosts
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%b\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%b\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Egress reachability check (VPS)
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" "bash -s" <<'REMOTE'
          set -Eeuo pipefail

          check_ws() {
            local url="$1"
            local key
            key=$(openssl rand -base64 16)
            local out curl_exit=0
            out=$(curl -sS --http1.1 --include --max-time 10 \
                -H "Connection: Upgrade" \
                -H "Upgrade: websocket" \
                -H "Sec-WebSocket-Key: $key" \
                -H "Sec-WebSocket-Version: 13" \
                "$url" 2>&1) || curl_exit=$?
            # 28 = CURLE_OPERATION_TIMEDOUT — expected after a successful WS handshake
            if [ "$curl_exit" -ne 0 ] && [ "$curl_exit" -ne 28 ]; then
              echo "WSS unreachable: $url"
              printf '%s\n' "$out" | head -5
              return 1
            fi
            if ! printf '%s\n' "$out" | grep -q ' 101 '; then
              echo "WSS no 101 upgrade: $url"
              printf '%s\n' "$out" | head -5
              return 1
            fi
            echo "ok wss $url"
          }

          check_https() {
            local url="$1"
            if ! curl -fsS --max-time 10 "$url" >/dev/null; then
              echo "HTTPS unreachable: $url"
              return 1
            fi
            echo "ok https $url"
          }

          check_ws    "https://ws.kraken.com/v2"
          check_ws    "https://ws.bitstamp.net/"
          check_ws    "https://advanced-trade-ws.coinbase.com/"
          check_https "https://api.kraken.com/0/public/SystemStatus"

          echo "egress reachability ok"
          REMOTE

      - name: VPS health checks
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          REPO_DIR: ${{ secrets.VPS_REPO_DIR }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" "REPO_DIR='$REPO_DIR' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          docker info >/dev/null
          docker compose version >/dev/null
          test -d "$REPO_DIR" || { echo "missing repo dir $REPO_DIR on VPS"; exit 1; }
          docker_root=$(docker info --format '{{.DockerRootDir}}' 2>/dev/null || echo /var/lib/docker)
          free_kb=$(df -P "$docker_root" | awk 'NR==2 {print $4}')
          [ "$free_kb" -gt 5242880 ] || { echo "low disk on $docker_root: $((free_kb/1024)) MB free, need >= 5120"; exit 1; }
          echo "health checks ok"
          REMOTE

  deploy:
    name: Deploy
    needs: pre-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Install SSH key & known_hosts
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%b\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%b\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Decrypt env files and upload to VPS
        timeout-minutes: 3
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          REPO_DIR: ${{ secrets.VPS_REPO_DIR }}
          KEY_ROOT:            ${{ secrets.DOTENV_PRIVATE_KEY_ROOT }}
          KEY_UNIFIED_API:     ${{ secrets.DOTENV_PRIVATE_KEY_UNIFIED_API }}
          KEY_MONITOR:         ${{ secrets.DOTENV_PRIVATE_KEY_MONITOR }}
          KEY_MM_CONTROLLER:   ${{ secrets.DOTENV_PRIVATE_KEY_MM_CONTROLLER }}
          KEY_FIAT_CONTROLLER: ${{ secrets.DOTENV_PRIVATE_KEY_FIAT_CONTROLLER }}
        run: |
          set -Eeuo pipefail
          for f in .env.enc dexUnifiedApi/.env.enc dexMonitor/.env.enc dexMmController/.env.enc dexFiatController/.env.enc; do
            test -f "$f" || { echo "Missing $f — run: cp .env .env.enc && dotenvx encrypt -f .env.enc in each directory, then commit"; exit 1; }
          done
          curl -sfS https://dotenvx.sh | sh
          # Decrypt each .env.enc in place (file becomes plain text after this).
          # Fail fast with a clear diagnostic if the committed pubkey doesn't match the
          # CI secret — usual cause is the post-commit encrypt-env.sh hook rotating the
          # keypair (cp .env .env.enc strips the pubkey). See project_dotenvx_hook_rekey.
          decrypt_or_die () {
            local f="$1" key="$2" secret="$3"
            if ! DOTENV_PRIVATE_KEY_ENC="$key" dotenvx decrypt -f "$f" >/dev/null 2>&1; then
              local pub; pub=$(grep -oE 'DOTENV_PUBLIC_KEY_ENC="[0-9a-f]+"' "$f" | head -1 || true)
              echo "::error::Cannot decrypt $f with secret $secret."
              echo "  Committed ${pub:-<no pubkey>} does not match that key. Likely the post-commit"
              echo "  encrypt-env.sh hook rotated the keypair (new privkey only lands in gitignored .env.keys)."
              echo "  Fix: re-encrypt $f pinned to the pubkey matching $secret, or rotate that secret."
              exit 1
            fi
          }
          decrypt_or_die .env.enc                   "$KEY_ROOT"            DOTENV_PRIVATE_KEY_ROOT
          decrypt_or_die dexUnifiedApi/.env.enc     "$KEY_UNIFIED_API"     DOTENV_PRIVATE_KEY_UNIFIED_API
          decrypt_or_die dexMonitor/.env.enc        "$KEY_MONITOR"         DOTENV_PRIVATE_KEY_MONITOR
          decrypt_or_die dexMmController/.env.enc   "$KEY_MM_CONTROLLER"   DOTENV_PRIVATE_KEY_MM_CONTROLLER
          decrypt_or_die dexFiatController/.env.enc "$KEY_FIAT_CONTROLLER" DOTENV_PRIVATE_KEY_FIAT_CONTROLLER
          # Upload decrypted files to VPS as .env
          scp -i ~/.ssh/id_ed25519 .env.enc                  "$SSH_USER@$SSH_HOST:$REPO_DIR/.env"
          scp -i ~/.ssh/id_ed25519 dexUnifiedApi/.env.enc    "$SSH_USER@$SSH_HOST:$REPO_DIR/dexUnifiedApi/.env"
          scp -i ~/.ssh/id_ed25519 dexMonitor/.env.enc       "$SSH_USER@$SSH_HOST:$REPO_DIR/dexMonitor/.env"
          scp -i ~/.ssh/id_ed25519 dexMmController/.env.enc  "$SSH_USER@$SSH_HOST:$REPO_DIR/dexMmController/.env"
          scp -i ~/.ssh/id_ed25519 dexFiatController/.env.enc "$SSH_USER@$SSH_HOST:$REPO_DIR/dexFiatController/.env"
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" "chmod 600 \
            '$REPO_DIR/.env' \
            '$REPO_DIR/dexUnifiedApi/.env' \
            '$REPO_DIR/dexMonitor/.env' \
            '$REPO_DIR/dexMmController/.env' \
            '$REPO_DIR/dexFiatController/.env'"

      - name: Sync VPS repo to commit, restart stack & verify (auto-rollback on failure)
        timeout-minutes: 10
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          REPO_DIR: ${{ secrets.VPS_REPO_DIR }}
          GHCR_TOKEN: ${{ secrets.GH_PAT }}
          GHCR_USER: ${{ github.actor }}
          NEW_SHA: ${{ github.sha }}
        # The VPS is a git clone (origin + a token URL-rewrite for auth are configured by
        # deploy/provision/ansible/playbook.yml), so we deliver the WHOLE repo tree at the
        # exact built commit via `git checkout` instead of scp-ing a hand-maintained subset.
        # That is what makes every config file (compose, nginx, deploy/monitoring, …) reach
        # prod automatically — no more "the new file wasn't in the copy list" deploys — and
        # makes rollback atomic across all of them (a single `git checkout <prev>`). The
        # decrypted .env files were uploaded by the previous step; the root one is gitignored
        # and the per-module ones live inside submodules, and we never recurse submodules, so
        # the checkout never touches them.
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" \
            "REPO_DIR='$REPO_DIR' GHCR_TOKEN='$GHCR_TOKEN' GHCR_USER='$GHCR_USER' NEW_SHA='$NEW_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          cd "$REPO_DIR"

          # Last good deploy, recorded only after a verified-healthy rollout below.
          PREV_SHA=$(cat .deployed_sha 2>/dev/null || true)

          # Fixed-image services with bind-mounted config aren't recreated by `up -d`, so they
          # keep serving the config they read at create time. Force-recreate them after the
          # rollout so the freshly-checked-out config (dashboards, prometheus/alert rules,
          # nginx upstreams) actually takes effect.
          RECREATE_SERVICES="grafana prometheus loki tempo alloy nginx"

          # Transition/robustness guard: a previous (scp-era) failed deploy could leave files
          # under the bind-mount config paths that Docker auto-created as root, which the
          # non-root deploy user can't overwrite — `git checkout` would then fail. Normalize
          # ownership once from a throwaway root container (deploy user is in the docker group).
          # Harmless once everything is already deploy-user-owned; .env files live elsewhere.
          docker run --rm -v "$REPO_DIR:/d" busybox:1.37 \
            chown -R "$(id -u):$(id -g)" /d/deploy /d/nginx 2>/dev/null || true

          # Pin the working tree to an exact commit. --force discards the dirty state the old
          # scp/tar deploys left behind; --detach avoids moving the local branch ref. We do
          # NOT recurse submodules: prod runs prebuilt GHCR images and only needs superproject
          # config, and skipping recursion leaves the submodule .env files untouched.
          sync_tree() {  # $1 = commit sha
            git fetch --no-tags origin "$1" || git fetch --no-tags origin main
            git checkout --force --detach "$1"
          }

          # --wait blocks until every service is healthy and returns non-zero otherwise,
          # which is what arms the rollback below.
          deploy() {  # $1 = commit sha (also the image tag; compose reads ${IMAGE_TAG:-latest})
            sync_tree "$1"
            # New VPSs receive a trusted certificate during Ansible edge provisioning. Keep a
            # self-signed pair only as a recovery guard: nginx needs some certificate to start
            # so a missing/invalid Let's Encrypt lineage can be repaired through webroot HTTP-01.
            if [ ! -s deploy/nginx/certs/server.crt ] || [ ! -s deploy/nginx/certs/server.key ]; then
              if [ -f deploy/nginx/gen-self-signed-cert.sh ]; then
                ENSURE=1 bash deploy/nginx/gen-self-signed-cert.sh localhost
              fi
            fi
            IMAGE_TAG="$1" docker compose pull
            IMAGE_TAG="$1" docker compose up -d --remove-orphans --wait --wait-timeout 300
            # The systemd timer owns regular renewal. CI only repairs an absent, expired, or
            # mismatched certificate and supports both IP (development) and hostname (production)
            # identities through /etc/dexarb/edge.env.
            if [ -x deploy/nginx/letsencrypt.sh ] && { [ -r /etc/dexarb/edge.env ] || grep -q '^LETSENCRYPT_EMAIL=.' .env; }; then
              if ! bash deploy/nginx/letsencrypt.sh verify; then
                bash deploy/nginx/letsencrypt.sh issue
              fi
            fi
            # shellcheck disable=SC2086
            IMAGE_TAG="$1" docker compose up -d --force-recreate --no-deps \
              --wait --wait-timeout 120 $RECREATE_SERVICES
          }

          # Each probe is a shell snippet tolerant of topology + auth changes. The
          # current stack serves the SPA at the edge (200, the login page); pre-auth
          # rollback targets gated the edge with basic auth (401). Either proves nginx
          # is up, so accept both. -k because the edge cert is self-signed — this is a
          # localhost reachability check, not cert validation.
          edge_up() {
            local code
            code=$(curl -kso /dev/null -w '%{http_code}' --max-time 10 https://127.0.0.1/ 2>/dev/null) || code=000
            [ "$code" = 200 ] || [ "$code" = 401 ] || curl -fsSL --max-time 10 http://127.0.0.1/ >/dev/null
          }
          # $1 = path. Data-path routes are now session-gated, so an unauthenticated
          # probe returns 401 — which still proves nginx routed it and the app + gate
          # are up. Pre-gate rollback targets return 200. Accept either; probe inside
          # the dexmonitor container (curl guaranteed by its healthcheck), falling back
          # to the edge for rollback targets that predate the dexmonitor rename.
          app_get() {
            local code
            code=$(docker compose exec -T dexmonitor curl -so /dev/null -w '%{http_code}' --max-time 30 "http://localhost:5000$1" 2>/dev/null) || code=000
            { [ "$code" = 200 ] || [ "$code" = 401 ]; } && return 0
            code=$(curl -sko /dev/null -w '%{http_code}' --max-time 30 "https://127.0.0.1$1" 2>/dev/null) || code=000
            { [ "$code" = 200 ] || [ "$code" = 401 ]; } && return 0
            code=$(curl -so /dev/null -w '%{http_code}' --max-time 30 "http://127.0.0.1$1" 2>/dev/null) || code=000
            [ "$code" = 200 ] || [ "$code" = 401 ]
          }
          smoke() {
            local name probe ok attempt
            for entry in \
              "unified-api /health::curl -fsSL --max-time 10 http://127.0.0.1:5010/health" \
              "web edge::edge_up" \
              "general_stats overview::app_get '/api/general_stats/overview?hours=24&cex=kraken'" \
              "ohlc::app_get '/api/ohlc?hours=24&cex=kraken'"; do
              name="${entry%%::*}"; probe="${entry#*::}"
              ok=""
              for attempt in 1 2 3; do
                if eval "$probe" >/dev/null 2>&1; then ok=1; break; fi
                echo "smoke attempt $attempt failed for $name"
                [ "$attempt" -lt 3 ] && sleep 5 || true
              done
              [ -n "$ok" ] || { echo "smoke test failed: $name"; return 1; }
              echo "ok $name"
            done
          }

          if deploy "$NEW_SHA" && smoke; then
            echo "$NEW_SHA" > .deployed_sha
            echo "deploy of $NEW_SHA healthy"
          else
            echo "::error::deploy of $NEW_SHA failed — rolling back to ${PREV_SHA:-<none>}"
            if [ -n "${PREV_SHA:-}" ]; then
              if deploy "$PREV_SHA" && smoke; then
                echo "::warning::rolled back to last-good $PREV_SHA"
              else
                echo "::error::ROLLBACK to $PREV_SHA FAILED — manual intervention required"
              fi
            else
              echo "::error::no previous SHA recorded — cannot auto-roll back"
            fi
            exit 1
          fi
          REMOTE
