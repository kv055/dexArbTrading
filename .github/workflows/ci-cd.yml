name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test-go:
    name: Go tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [commons, dexUnifiedApi, dexMmController, dexMonitor, dexFiatController]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: go test ./...

  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dexMonitor/react-frontend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dexMonitor/react-frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (tsc + vite)
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dexMonitor/react-frontend/playwright-report/
          retention-days: 7

  build-and-push:
    name: Build & push ${{ matrix.service }}
    needs: [test-go, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: tor
            context: ./dexUnifiedApi
            dockerfile: dexUnifiedApi/Dockerfile.tor
          - service: bisq
            context: ./dexUnifiedApi
            dockerfile: dexUnifiedApi/Dockerfile.bisq
          - service: unified-api
            context: .
            dockerfile: dexUnifiedApi/Dockerfile
          - service: unified-snapshot
            context: .
            dockerfile: dexUnifiedApi/Dockerfile.snapshot
          - service: postgres-backup
            context: .
            dockerfile: dexUnifiedApi/Dockerfile.backup
          - service: app
            context: .
            dockerfile: dexMonitor/Dockerfile
          - service: mm-controller
            context: ./dexMmController
            dockerfile: dexMmController/Dockerfile
          - service: totp-api
            context: ./dexFiatController/services/totp-api
            dockerfile: dexFiatController/services/totp-api/Dockerfile
          - service: fiat-controller
            context: ./dexFiatController
            dockerfile: dexFiatController/Dockerfile
          - service: docs
            context: .
            dockerfile: docs/Dockerfile.docs
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compute lowercase image owner
        id: owner
        run: |
          echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/dexarbtrading-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/dexarbtrading-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  notify-vps:
    name: Trigger VPS deploy
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Call deploy webhook
        env:
          WEBHOOK_URL: ${{ secrets.VPS_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.VPS_WEBHOOK_SECRET }}
          PAYLOAD: '{"ref":"refs/heads/main","after":"${{ github.sha }}","repository":{"full_name":"${{ github.repository }}"}}'
        run: |
          sig=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -hex | awk '{print $NF}')
          curl -fsSL --max-time 30 -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: push' \
            -H "X-Hub-Signature-256: sha256=$sig" \
            --data-raw "$PAYLOAD"
