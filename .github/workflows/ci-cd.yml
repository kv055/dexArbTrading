name: CI/CD

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - '.vscode/**'
      - '.codex'
      - '.agents/**'
      - '.lefthook/**'
      - 'lefthook.yml'
      - 'deploy/provision/**'
      - 'dexMmController/docs/**'
      - 'dexMonitor/docs/**'
      - 'dexUnifiedApi/docs/**'
      - 'dexMmTradingLogicHummingBot/**'
      - '.gitignore'
      - '.gitmodules'
      - 'LICENSE'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - '.vscode/**'
      - '.codex'
      - '.agents/**'
      - '.lefthook/**'
      - 'lefthook.yml'
      - 'deploy/provision/**'
      - 'dexMmController/docs/**'
      - 'dexMonitor/docs/**'
      - 'dexUnifiedApi/docs/**'
      - 'dexMmTradingLogicHummingBot/**'
      - '.gitignore'
      - '.gitmodules'
      - 'LICENSE'

permissions:
  contents: read
  packages: write

# Per-branch serialization: keeps the single-VPS deploy (main) from overlapping
# itself, while a long develop/staging validation never queues ahead of a prod deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  test-go:
    name: Go tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [commons, dexUnifiedApi, dexMmController, dexMonitor, dexFiatController]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: go test ./...

  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dexMonitor/react-frontend
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dexMonitor/react-frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (tsc + vite)
        run: npm run build

      # TEMP: Playwright e2e disabled while dashboard analytics changes stabilize.
      # - name: Cache Playwright browsers
      #   uses: actions/cache@v5
      #   id: playwright-cache
      #   with:
      #     path: ~/.cache/ms-playwright
      #     key: playwright-chromium-${{ hashFiles('dexMonitor/react-frontend/package-lock.json') }}
      #
      # - name: Install Playwright browsers + deps
      #   if: steps.playwright-cache.outputs.cache-hit != 'true'
      #   # The browser download intermittently stalls with no internal timeout, which
      #   # hung this job for hours before. Bound each attempt and retry; re-running the
      #   # apt portion is cheap since the system deps are already installed.
      #   run: |
      #     for i in 1 2 3; do
      #       timeout 300 npx playwright install --with-deps chromium && exit 0
      #       echo "::warning::playwright install attempt $i stalled/failed; retrying"
      #     done
      #     exit 1
      #
      # - name: Install Playwright system deps (cache hit)
      #   if: steps.playwright-cache.outputs.cache-hit == 'true'
      #   run: npx playwright install-deps chromium
      #
      # - name: Run Playwright e2e tests
      #   run: npm run test:e2e
      #
      # - name: Upload Playwright report
      #   if: failure()
      #   uses: actions/upload-artifact@v6
      #   with:
      #     name: playwright-report
      #     path: dexMonitor/react-frontend/playwright-report/
      #     retention-days: 7

  build-and-push:
    name: Build & push ${{ matrix.service }}
    needs: [test-go, test-frontend]
    # Runs on both push (build + push) and pull_request (build-only validation, see the
    # 'push:' flag below) so a bad image — e.g. an auto bisq bump — is caught before merge.
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILD_SUMMARY: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: tor
            context: ./dexUnifiedApi
            dockerfile: dexUnifiedApi/Dockerfile.tor
          - service: bisq
            context: ./dexUnifiedApi
            dockerfile: dexUnifiedApi/Dockerfile.bisq
          - service: bisq2
            context: ./dexUnifiedApi
            dockerfile: dexUnifiedApi/Dockerfile.bisq2
          - service: unified-api
            context: .
            dockerfile: dexUnifiedApi/Dockerfile
          - service: unified-snapshot
            context: .
            dockerfile: dexUnifiedApi/Dockerfile.snapshot
          - service: postgres-backup
            context: .
            dockerfile: dexUnifiedApi/Dockerfile.backup
          - service: dexmonitor
            context: .
            dockerfile: dexMonitor/Dockerfile
          - service: mm-controller
            context: ./dexMmController
            dockerfile: dexMmController/Dockerfile
          - service: totp-api
            context: ./dexFiatController/services/totp-api
            dockerfile: dexFiatController/services/totp-api/Dockerfile
          - service: fiat-controller
            context: ./dexFiatController
            dockerfile: dexFiatController/Dockerfile
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Compute lowercase image owner
        id: owner
        run: |
          echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Compute build metadata
        id: meta
        run: |
          echo "commit_hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "commit_date=$(git log -1 --format=%cI)"   >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # Frontend "deployed commit" header values; only the dexmonitor image
          # consumes them, the rest emit a harmless "unused build args" buildx warning.
          build-args: |
            COMMIT_HASH=${{ steps.meta.outputs.commit_hash }}
            COMMIT_DATE=${{ steps.meta.outputs.commit_date }}
          # Push only on merges to main; PRs build for validation but never publish/deploy.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/dexarbtrading-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/dexarbtrading-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  build-report:
    name: Build report
    needs: build-and-push
    if: always() && needs.build-and-push.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Write consolidated summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Docker Build Summary"
            echo ""
            echo "| Service | Status | Duration |"
            echo "|---------|:------:|:--------:|"
            gh api "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
              --paginate --jq '
                .jobs[]
                | select(.name | startswith("Build & push "))
                | {
                    svc:        (.name | ltrimstr("Build & push ")),
                    conclusion: .conclusion,
                    duration: (
                      if .started_at and .completed_at then
                        ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) | "\(.)s"
                      else "—" end
                    )
                  }
                | "| \(.svc) | \(if .conclusion == "success" then "✅ success" elif .conclusion == "failure" then "❌ failure" elif .conclusion == null then "🔄 running" else "⚠️ \(.conclusion)" end) | \(.duration) |"
              '
            echo ""
            echo "_Run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_"
          } >> "$GITHUB_STEP_SUMMARY"

  pre-deploy:
    name: Pre-deploy checks
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVICES: tor bisq bisq2 unified-api unified-snapshot postgres-backup dexmonitor mm-controller totp-api fiat-controller
    steps:
      - name: Compute lowercase image owner
        id: owner
        run: |
          echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify all image SHA tags exist in GHCR
        env:
          OWNER: ${{ steps.owner.outputs.value }}
          SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          for svc in $SERVICES; do
            tag="${REGISTRY}/${OWNER}/dexarbtrading-${svc}:${SHA}"
            echo "checking $tag"
            docker manifest inspect "$tag" >/dev/null
          done

      - name: Install SSH key & known_hosts
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%b\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%b\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Egress reachability check (VPS)
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" "bash -s" <<'REMOTE'
          set -Eeuo pipefail

          check_ws() {
            local url="$1"
            local key
            key=$(openssl rand -base64 16)
            local out curl_exit=0
            out=$(curl -sS --http1.1 --include --max-time 10 \
                -H "Connection: Upgrade" \
                -H "Upgrade: websocket" \
                -H "Sec-WebSocket-Key: $key" \
                -H "Sec-WebSocket-Version: 13" \
                "$url" 2>&1) || curl_exit=$?
            # 28 = CURLE_OPERATION_TIMEDOUT — expected after a successful WS handshake
            if [ "$curl_exit" -ne 0 ] && [ "$curl_exit" -ne 28 ]; then
              echo "WSS unreachable: $url"
              printf '%s\n' "$out" | head -5
              return 1
            fi
            if ! printf '%s\n' "$out" | grep -q ' 101 '; then
              echo "WSS no 101 upgrade: $url"
              printf '%s\n' "$out" | head -5
              return 1
            fi
            echo "ok wss $url"
          }

          check_https() {
            local url="$1"
            if ! curl -fsS --max-time 10 "$url" >/dev/null; then
              echo "HTTPS unreachable: $url"
              return 1
            fi
            echo "ok https $url"
          }

          check_ws    "https://ws.kraken.com/v2"
          check_ws    "https://ws.bitstamp.net/"
          check_ws    "https://advanced-trade-ws.coinbase.com/"
          check_https "https://api.kraken.com/0/public/SystemStatus"

          echo "egress reachability ok"
          REMOTE

      - name: VPS health checks
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          REPO_DIR: ${{ secrets.VPS_REPO_DIR }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" "REPO_DIR='$REPO_DIR' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          docker info >/dev/null
          docker compose version >/dev/null
          test -d "$REPO_DIR" || { echo "missing repo dir $REPO_DIR on VPS"; exit 1; }
          docker_root=$(docker info --format '{{.DockerRootDir}}' 2>/dev/null || echo /var/lib/docker)
          free_kb=$(df -P "$docker_root" | awk 'NR==2 {print $4}')
          [ "$free_kb" -gt 5242880 ] || { echo "low disk on $docker_root: $((free_kb/1024)) MB free, need >= 5120"; exit 1; }
          echo "health checks ok"
          REMOTE

  deploy:
    name: Deploy
    needs: pre-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Install SSH key & known_hosts
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%b\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%b\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Decrypt env files and upload to VPS
        timeout-minutes: 3
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          REPO_DIR: ${{ secrets.VPS_REPO_DIR }}
          KEY_ROOT:            ${{ secrets.DOTENV_PRIVATE_KEY_ROOT }}
          KEY_UNIFIED_API:     ${{ secrets.DOTENV_PRIVATE_KEY_UNIFIED_API }}
          KEY_MONITOR:         ${{ secrets.DOTENV_PRIVATE_KEY_MONITOR }}
          KEY_MM_CONTROLLER:   ${{ secrets.DOTENV_PRIVATE_KEY_MM_CONTROLLER }}
          KEY_FIAT_CONTROLLER: ${{ secrets.DOTENV_PRIVATE_KEY_FIAT_CONTROLLER }}
        run: |
          set -Eeuo pipefail
          for f in .env.enc dexUnifiedApi/.env.enc dexMonitor/.env.enc dexMmController/.env.enc dexFiatController/.env.enc; do
            test -f "$f" || { echo "Missing $f — run: cp .env .env.enc && dotenvx encrypt -f .env.enc in each directory, then commit"; exit 1; }
          done
          curl -sfS https://dotenvx.sh | sh
          # Decrypt each .env.enc in place (file becomes plain text after this)
          DOTENV_PRIVATE_KEY_ENC="$KEY_ROOT"            dotenvx decrypt -f .env.enc
          DOTENV_PRIVATE_KEY_ENC="$KEY_UNIFIED_API"     dotenvx decrypt -f dexUnifiedApi/.env.enc
          DOTENV_PRIVATE_KEY_ENC="$KEY_MONITOR"         dotenvx decrypt -f dexMonitor/.env.enc
          DOTENV_PRIVATE_KEY_ENC="$KEY_MM_CONTROLLER"   dotenvx decrypt -f dexMmController/.env.enc
          DOTENV_PRIVATE_KEY_ENC="$KEY_FIAT_CONTROLLER" dotenvx decrypt -f dexFiatController/.env.enc
          # Upload decrypted files to VPS as .env
          scp -i ~/.ssh/id_ed25519 .env.enc                  "$SSH_USER@$SSH_HOST:$REPO_DIR/.env"
          scp -i ~/.ssh/id_ed25519 dexUnifiedApi/.env.enc    "$SSH_USER@$SSH_HOST:$REPO_DIR/dexUnifiedApi/.env"
          scp -i ~/.ssh/id_ed25519 dexMonitor/.env.enc       "$SSH_USER@$SSH_HOST:$REPO_DIR/dexMonitor/.env"
          scp -i ~/.ssh/id_ed25519 dexMmController/.env.enc  "$SSH_USER@$SSH_HOST:$REPO_DIR/dexMmController/.env"
          scp -i ~/.ssh/id_ed25519 dexFiatController/.env.enc "$SSH_USER@$SSH_HOST:$REPO_DIR/dexFiatController/.env"
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" "chmod 600 \
            '$REPO_DIR/.env' \
            '$REPO_DIR/dexUnifiedApi/.env' \
            '$REPO_DIR/dexMonitor/.env' \
            '$REPO_DIR/dexMmController/.env' \
            '$REPO_DIR/dexFiatController/.env'"

      - name: Sync VPS repo to commit, restart stack & verify (auto-rollback on failure)
        timeout-minutes: 10
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          REPO_DIR: ${{ secrets.VPS_REPO_DIR }}
          GHCR_TOKEN: ${{ secrets.GH_PAT }}
          GHCR_USER: ${{ github.actor }}
          NEW_SHA: ${{ github.sha }}
        # The VPS is a git clone (origin + a token URL-rewrite for auth are configured by
        # deploy/provision/ansible/playbook.yml), so we deliver the WHOLE repo tree at the
        # exact built commit via `git checkout` instead of scp-ing a hand-maintained subset.
        # That is what makes every config file (compose, nginx, deploy/monitoring, …) reach
        # prod automatically — no more "the new file wasn't in the copy list" deploys — and
        # makes rollback atomic across all of them (a single `git checkout <prev>`). The
        # decrypted .env files were uploaded by the previous step; the root one is gitignored
        # and the per-module ones live inside submodules, and we never recurse submodules, so
        # the checkout never touches them.
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" \
            "REPO_DIR='$REPO_DIR' GHCR_TOKEN='$GHCR_TOKEN' GHCR_USER='$GHCR_USER' NEW_SHA='$NEW_SHA' CERT_CN='$SSH_HOST' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          cd "$REPO_DIR"

          # Last good deploy, recorded only after a verified-healthy rollout below.
          PREV_SHA=$(cat .deployed_sha 2>/dev/null || true)

          # Fixed-image services with bind-mounted config aren't recreated by `up -d`, so they
          # keep serving the config they read at create time. Force-recreate them after the
          # rollout so the freshly-checked-out config (dashboards, prometheus/alert rules,
          # nginx upstreams) actually takes effect.
          RECREATE_SERVICES="grafana prometheus loki tempo alloy nginx"

          # Transition/robustness guard: a previous (scp-era) failed deploy could leave files
          # under the bind-mount config paths that Docker auto-created as root, which the
          # non-root deploy user can't overwrite — `git checkout` would then fail. Normalize
          # ownership once from a throwaway root container (deploy user is in the docker group).
          # Harmless once everything is already deploy-user-owned; .env files live elsewhere.
          docker run --rm -v "$REPO_DIR:/d" busybox:1.37 \
            chown -R "$(id -u):$(id -g)" /d/deploy /d/nginx 2>/dev/null || true

          # Pin the working tree to an exact commit. --force discards the dirty state the old
          # scp/tar deploys left behind; --detach avoids moving the local branch ref. We do
          # NOT recurse submodules: prod runs prebuilt GHCR images and only needs superproject
          # config, and skipping recursion leaves the submodule .env files untouched.
          sync_tree() {  # $1 = commit sha
            git fetch --no-tags origin "$1" || git fetch --no-tags origin main
            git checkout --force --detach "$1"
          }

          # --wait blocks until every service is healthy and returns non-zero otherwise,
          # which is what arms the rollback below.
          deploy() {  # $1 = commit sha (also the image tag; compose reads ${IMAGE_TAG:-latest})
            sync_tree "$1"
            # nginx won't boot without its TLS cert, which would hang `up --wait` and trip the
            # rollback below. The cert is self-signed and gitignored, so it never arrives via
            # the checkout — create/renew it here on the VPS, after the tree is in place and
            # before `up`. CERT_CN is the public host so agents can pin it with --cacert; ENSURE
            # renews only when <30d to expiry, else it's a no-op. The [ -f ] guard makes a
            # rollback to a pre-cert SHA (whose tree has no script, and whose nginx is plain
            # HTTP) a clean no-op instead of a "No such file" error.
            if [ -f deploy/nginx/gen-self-signed-cert.sh ]; then
              ENSURE=1 CERT_CN="${CERT_CN:-localhost}" bash deploy/nginx/gen-self-signed-cert.sh "${CERT_CN:-localhost}"
            fi
            IMAGE_TAG="$1" docker compose pull
            IMAGE_TAG="$1" docker compose up -d --remove-orphans --wait --wait-timeout 300
            # shellcheck disable=SC2086
            IMAGE_TAG="$1" docker compose up -d --force-recreate --no-deps \
              --wait --wait-timeout 120 $RECREATE_SERVICES
          }

          # Each probe is a shell snippet tolerant of topology + auth changes. The
          # current stack serves the SPA at the edge (200, the login page); pre-auth
          # rollback targets gated the edge with basic auth (401). Either proves nginx
          # is up, so accept both. -k because the edge cert is self-signed — this is a
          # localhost reachability check, not cert validation.
          edge_up() {
            local code
            code=$(curl -kso /dev/null -w '%{http_code}' --max-time 10 https://127.0.0.1:5443/ 2>/dev/null) || code=000
            [ "$code" = 200 ] || [ "$code" = 401 ] || curl -fsSL --max-time 10 http://127.0.0.1:5000/ >/dev/null
          }
          # $1 = path. Data-path routes are now session-gated, so an unauthenticated
          # probe returns 401 — which still proves nginx routed it and the app + gate
          # are up. Pre-gate rollback targets return 200. Accept either; probe inside
          # the dexmonitor container (curl guaranteed by its healthcheck), falling back
          # to the edge for rollback targets that predate the dexmonitor rename.
          app_get() {
            local code
            code=$(docker compose exec -T dexmonitor curl -so /dev/null -w '%{http_code}' --max-time 30 "http://localhost:5000$1" 2>/dev/null) || code=000
            { [ "$code" = 200 ] || [ "$code" = 401 ]; } && return 0
            code=$(curl -sko /dev/null -w '%{http_code}' --max-time 30 "https://127.0.0.1:5443$1" 2>/dev/null) || code=000
            { [ "$code" = 200 ] || [ "$code" = 401 ]; } && return 0
            code=$(curl -so /dev/null -w '%{http_code}' --max-time 30 "http://127.0.0.1:5000$1" 2>/dev/null) || code=000
            [ "$code" = 200 ] || [ "$code" = 401 ]
          }
          smoke() {
            local name probe ok attempt
            for entry in \
              "unified-api /health::curl -fsSL --max-time 10 http://127.0.0.1:5010/health" \
              "web edge::edge_up" \
              "general_stats overview::app_get '/api/general_stats/overview?hours=24&cex=kraken'" \
              "ohlc::app_get '/api/ohlc?hours=24&cex=kraken'"; do
              name="${entry%%::*}"; probe="${entry#*::}"
              ok=""
              for attempt in 1 2 3; do
                if eval "$probe" >/dev/null 2>&1; then ok=1; break; fi
                echo "smoke attempt $attempt failed for $name"
                [ "$attempt" -lt 3 ] && sleep 5 || true
              done
              [ -n "$ok" ] || { echo "smoke test failed: $name"; return 1; }
              echo "ok $name"
            done
          }

          if deploy "$NEW_SHA" && smoke; then
            echo "$NEW_SHA" > .deployed_sha
            echo "deploy of $NEW_SHA healthy"
          else
            echo "::error::deploy of $NEW_SHA failed — rolling back to ${PREV_SHA:-<none>}"
            if [ -n "${PREV_SHA:-}" ]; then
              if deploy "$PREV_SHA" && smoke; then
                echo "::warning::rolled back to last-good $PREV_SHA"
              else
                echo "::error::ROLLBACK to $PREV_SHA FAILED — manual intervention required"
              fi
            else
              echo "::error::no previous SHA recorded — cannot auto-roll back"
            fi
            exit 1
          fi
          REMOTE
