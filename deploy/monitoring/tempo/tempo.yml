# Tempo single-binary config for the dexArbTrading trace stack.
#
# Receives OTLP from Alloy (which the Go services push to) and stores traces on
# local disk. Reachable only on the docker network — Grafana queries it at
# http://tempo:3200; Alloy exports to tempo:4317.
server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 168h # 7 days, matched to Loki

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
