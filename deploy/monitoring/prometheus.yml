global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    stack: dexarbtrading

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: unified-api
    static_configs:
      - targets: ["unified-api:5010"]

  - job_name: dexmonitor
    static_configs:
      - targets: ["dexmonitor:5000"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: mm-controller
    static_configs:
      - targets: ["mm-controller:5001"]

  # fiat-controller exposes /metrics on :8080 but the compose service is
  # currently disabled (commented out in docker-compose.yml). Uncomment this
  # job together with the service to avoid a permanently-down target.
  # - job_name: fiat-controller
  #   static_configs:
  #     - targets: ["fiat-controller:8080"]
