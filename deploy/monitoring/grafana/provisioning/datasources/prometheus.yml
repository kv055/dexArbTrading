apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # Pinned uid so agents (and the alert rules) can target this datasource by a
    # stable name via Grafana's proxy API, e.g.
    #   /grafana/api/datasources/proxy/uid/prometheus/api/v1/query
    # Without it Grafana assigns a random uid, forcing a magic-string lookup.
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
