---
- name: Validate edge configuration
  ansible.builtin.assert:
    that:
      - edge_mode in ['production', 'development']
      - letsencrypt_email | default('') | length > 0
      - edge_mode != 'production' or godaddy_pat | default('') | length > 0
    fail_msg: >-
      edge mode requires LETSENCRYPT_EMAIL and production additionally requires GODADDY_PAT
  tags: [edge]

- name: Install jq for DNS reconciliation
  ansible.builtin.apt:
    name: jq
    state: present
    update_cache: true
  tags: [edge, dns]

- name: Create edge configuration directory
  ansible.builtin.file:
    path: /etc/dexarb
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [edge]

- name: Persist edge certificate configuration
  ansible.builtin.template:
    src: edge.env.j2
    dest: /etc/dexarb/edge.env
    owner: root
    group: root
    mode: "0644"
  tags: [edge]

- name: Create edge helper directory
  ansible.builtin.file:
    path: /usr/local/lib/dexarb
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [edge]

- name: Install edge certificate helper
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../nginx/letsencrypt.sh"
    dest: /usr/local/lib/dexarb/letsencrypt.sh
    owner: root
    group: root
    mode: "0755"
  tags: [edge]

- name: Point public GoDaddy DNS at this VPS
  ansible.builtin.script: files/godaddy-dns-upsert.sh
  environment:
    GODADDY_PAT: "{{ godaddy_pat }}"
    GODADDY_DOMAIN: "{{ public_hostname }}"
    GODADDY_IP: "{{ ansible_host }}"
  no_log: true
  changed_when: false
  when: edge_mode == 'production'
  tags: [edge, dns]

- name: Wait for public DNS propagation
  ansible.builtin.command: getent ahostsv4 {{ public_hostname }}
  register: public_dns
  changed_when: false
  until: ansible_host in public_dns.stdout
  retries: 30
  delay: 10
  when: edge_mode == 'production'
  tags: [edge, dns]

- name: Create nginx certificate and Certbot state directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0750"
  loop:
    - "{{ app_dir }}/deploy/nginx/letsencrypt"
    - "{{ app_dir }}/deploy/nginx/certs"
  tags: [edge]

- name: Create nginx ACME challenge directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0755"
  loop:
    - "{{ edge_http01_webroot }}"
    - "{{ edge_http01_webroot }}/.well-known"
    - "{{ edge_http01_webroot }}/.well-known/acme-challenge"
  tags: [edge]

- name: Install certificate renewal service
  ansible.builtin.template:
    src: dexarb-certbot.service.j2
    dest: /etc/systemd/system/dexarb-certbot.service
    mode: "0644"
  tags: [edge]

- name: Install certificate renewal timer
  ansible.builtin.template:
    src: dexarb-certbot.timer.j2
    dest: /etc/systemd/system/dexarb-certbot.timer
    mode: "0644"
  tags: [edge]

- name: Enable certificate renewal timer
  ansible.builtin.systemd:
    name: dexarb-certbot.timer
    enabled: true
    state: started
    daemon_reload: true
  tags: [edge]

- name: Issue or refresh the edge certificate
  ansible.builtin.command: /usr/local/lib/dexarb/letsencrypt.sh issue
  args:
    chdir: "{{ app_dir }}"
  become_user: "{{ deploy_user }}"
  register: certificate_issue
  changed_when: "'certificate unchanged' not in certificate_issue.stdout"
  tags: [edge]

- name: Check whether nginx is running for the public ACME probe
  ansible.builtin.command: docker compose ps --status running --services nginx
  args:
    chdir: "{{ app_dir }}"
  become_user: "{{ deploy_user }}"
  register: edge_nginx_services
  changed_when: false
  tags: [edge]

- name: Verify public ACME challenge path when nginx is running
  when: "'nginx' in edge_nginx_services.stdout_lines"
  block:
    - name: Write public ACME challenge probe
      ansible.builtin.copy:
        dest: "{{ edge_http01_webroot }}/.well-known/acme-challenge/dexarb-provision-probe"
        content: "dexarb-provision-probe\n"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0644"

    - name: Read public ACME challenge probe
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}/.well-known/acme-challenge/dexarb-provision-probe"
        return_content: true
        status_code: 200
      register: acme_http_probe
      failed_when: acme_http_probe.content | trim != 'dexarb-provision-probe'
      changed_when: false

  always:
    - name: Remove public ACME challenge probe
      ansible.builtin.file:
        path: "{{ edge_http01_webroot }}/.well-known/acme-challenge/dexarb-provision-probe"
        state: absent
  tags: [edge]
