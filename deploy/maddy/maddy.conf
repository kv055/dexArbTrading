$(hostname) = {env:MADDY_HOSTNAME}
$(primary_domain) = {env:MADDY_DOMAIN}
$(local_domains) = $(primary_domain)
$(payments_recipient) = {env:MADDY_RECIPIENT}

state_dir /data
runtime_dir /tmp/maddy
hostname $(hostname)
tls file /data/tls/fullchain.pem /data/tls/privkey.pem

auth.pass_table local_authdb {
    table sql_table {
        driver sqlite3
        dsn credentials.db
        table_name passwords
    }
}

storage.imapsql local_mailboxes {
    driver sqlite3
    dsn imapsql.db
}

# Exact-recipient local delivery only: no aliases, catch-all, submission, remote
# queue, or outbound delivery target exists in this configuration.
msgpipeline local_routing {
    destination $(payments_recipient) {
        deliver_to &local_mailboxes
    }
    default_destination {
        reject 550 5.1.1 "User doesn't exist"
    }
}

smtp tcp://0.0.0.0:25 {
    limits {
        all rate 20 1s
        all concurrency 10
    }

    # Failed checks use Maddy's default fail_action=quarantine. Authentication-
    # Results is retained for the Fiat Controller's provider-domain gate.
    dmarc yes
    check {
        require_mx_record
        dkim
        spf
    }

    source $(local_domains) {
        reject 501 5.1.8 "Local sender domains are not accepted"
    }
    default_source {
        destination $(payments_recipient) {
            deliver_to &local_routing
        }
        default_destination {
            reject 550 5.1.1 "User doesn't exist"
        }
    }
}

# TLS-only and Docker-internal. Compose does not publish this port.
imap tls://0.0.0.0:993 {
    auth &local_authdb
    storage &local_mailboxes
}
