# Run `lefthook install` once per clone to wire these into .git/hooks.
# These local guards are the protection for `main` on this Free private repo
# (server-side GitHub branch protection needs Pro or a public repo). They are
# bypassable with --no-verify, so treat them as a guardrail, not a hard wall.

pre-commit:
  scripts:
    "protect-main.sh":
      runner: bash
    "protect-secrets.sh":
      runner: bash

pre-push:
  # use_stdin forwards git's pre-push ref list (<local ref> <local sha> <remote ref>
  # <remote sha>) to the script's `while read`; without it lefthook drops stdin (it uses
  # a pseudo-TTY) and the guard is blind. The script form avoids the command-level
  # push-files filtering that can skip the guard.
  scripts:
    "protect-main.sh": # reject pushes whose target ref is refs/heads/main
      runner: bash
      use_stdin: true

pre-merge-commit:
  scripts:
    "protect-main.sh": # reject local merges made while on main
      runner: bash

post-commit:
  scripts:
    "encrypt-env.sh":
      runner: bash
